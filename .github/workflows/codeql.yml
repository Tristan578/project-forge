name: "CodeQL Advanced"

# NO `push` TRIGGER, deliberately (#9527).
#
# The repo is squash-only, so every commit on `main` arrived through a PR where
# the dynamic-matrix analysis below already ran pre-merge. A push run re-analysed
# byte-identical content: measured at 18.5 job-min mean across 12 sampled push
# runs, 220 push runs in the 30 days to 2026-08-31, so roughly 4,080 job-min a
# month for no marginal signal. CodeQL is advisory here -- ruleset 12865786
# requires only `CI Success` -- so nothing was gating on it either.
#
# The weekly `schedule` runs on the default branch and takes the full
# three-language matrix (the `else` branch in the matrix step below), so
# main-branch alerts still refresh; they refresh weekly rather than per merge.
# The accepted cost is a cross-language finding introduced by a single-language
# change surfacing up to 7 days late. `workflow_dispatch` is here so that window
# can be closed on demand instead of only by waiting for Wednesday.
on:
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '17 7 * * 3'
  workflow_dispatch:

# github.event_name is part of the key on purpose. Every trigger that fires on
# the default branch resolves github.ref to the same refs/heads/main, so without
# it a scheduled scan and a dispatched one share a group -- and with
# cancel-in-progress, whichever starts second kills the first. That would make
# an on-demand scan silently abort the weekly one it was meant to supplement.
#
# The collision is older than the workflow_dispatch above: `push` fired on main
# too, so a merge landing during the Wednesday 07:17 scan already cancelled it.
# Splitting by event fixes that case as well.
#
# Deduplication within a trigger is preserved: two dispatches, or two pushes to
# the same ref, still collapse to the latest. Pull requests were never affected
# -- github.ref is refs/pull/N/merge there, already distinct per PR.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Determine CodeQL Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.compute.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Compute language matrix
        id: compute
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Match on FILE EXTENSION, not directory prefix. The original
          # prefix form ('^(web/|mcp-server/)') left every other JS/TS root in
          # the monorepo — apps/, packages/, scripts/, tools/, infra/,
          # autoforge/, .claude/ — with no pre-merge CodeQL analysis at all
          # (#9444). A prefix list has to be remembered on every new top-level
          # directory; an extension match does not.
          #
          # No `python` leg by design. Python ran here from 2026-03-02 to
          # 2026-03-18 (1090 analyses, zero results) and was removed by
          # 56a41e41. The repo's Python is agent tooling under .claude/hooks
          # that shells out with argv lists — no shell=True, eval, or pickle,
          # and no remote-tainted input path. Re-add it only if that changes;
          # do not re-litigate it as an oversight.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            langs='[]'
            if grep -qE '^\.github/workflows/' <<< "$CHANGED"; then
              langs=$(jq -c '. + ["actions"]' <<< "$langs")
            fi
            if grep -qE '\.(js|jsx|mjs|cjs|ts|tsx)$|(^|/)(package\.json|package-lock\.json|tsconfig[^/]*\.json)$' <<< "$CHANGED"; then
              langs=$(jq -c '. + ["javascript-typescript"]' <<< "$langs")
            fi
            # .transform-gizmo-fork is a vendored upstream crate; changes there
            # are pulls, not authored code, so they do not warrant a full Rust
            # analysis on their own.
            #
            # Filter into a variable rather than piping into `grep -q`: under
            # `set -o pipefail`, `grep -q` exits on its first match and SIGPIPEs
            # the writer, so the pipeline reports failure and the verdict of the
            # test inverts. `|| true` because `grep -v` exits 1 when the filter
            # removes every line.
            AUTHORED=$(grep -vE '^\.transform-gizmo-fork/' <<< "$CHANGED" || true)
            if grep -qE '\.rs$|(^|/)Cargo\.(toml|lock)$' <<< "$AUTHORED"; then
              langs=$(jq -c '. + ["rust"]' <<< "$langs")
            fi
          else
            langs='["actions","javascript-typescript","rust"]'
          fi
          echo "matrix=$langs" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: ${{ needs.changes.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@256d634097be96e792d6764f9edaefc4320557b1 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@256d634097be96e792d6764f9edaefc4320557b1 # v4
        with:
          category: "/language:${{ matrix.language }}"
