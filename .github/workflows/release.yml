name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  actions: write # dispatch ci.yml onto changeset-release/main (#9161 / #9381)

# Concurrency is scoped per-job rather than workflow-wide:
#   • Version Packages is idempotent — it only recreates changeset-release/main
#     from the current state of main — so a rapid batch-merge needs just the
#     LATEST run; earlier ones cancel (cancel-in-progress: true). This collapses
#     a pile-up of pushes into one run and avoids the transient failure
#     notifications ("No commits between main and changeset-release/main" when a
#     version PR merges with no newer changesets queued, and GraphQL flakes in
#     @changesets/get-github-info) that fire when many Release runs stack up.
#   • Tag and Release must NEVER be cancelled mid-publish, or a version's git tag
#     / GitHub Release could be silently skipped, so it serializes WITHOUT
#     cancellation (cancel-in-progress: false). It is also idempotent (it checks
#     for an existing tag/release first), so serializing is purely a safety net.

jobs:
  release:
    name: Version Packages
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-version-packages-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # changesets/action v2 renamed every input (title→pr-title, commit→
      # commit-message, version→version-script) and stopped reading the
      # GITHUB_TOKEN env var — the token MUST arrive via the `github-token`
      # input. The Dependabot major bump to v2.1.0 (#9298) kept the v1 names,
      # so every Release run failed at this step with "The following inputs
      # have been renamed" and no Version Packages PR was produced.
      # v2 also pushes the release branch through the GitHub API by default
      # (commits land GitHub-signed); the workflow's `contents: write` +
      # `pull-requests: write` grants are sufficient for that.
      #
      # The SAME Dependabot wave bumped @changesets/cli to 3.0.0 (#9300), whose
      # breaking change "private packages are no longer versioned by default"
      # silently emptied this step: `web` is `private: true` and owns every real
      # changeset, so `changeset version` bumped nothing, printed "All files have
      # been updated", and the action pushed an EMPTY "chore: version packages"
      # commit. The run stayed green and the PR stayed open with a blank
      # `# Releases` body and no changelog PR/author links — the only symptom.
      # `.changeset/config.json` now pins `privatePackages` explicitly. If that
      # PR ever goes contentless again while changesets sit on main, diff
      # `npx changeset status` against the CLI version in package-lock.json
      # BEFORE trusting a local run: a stale local node_modules will happily
      # report a bump that CI does not perform.
      - name: Create or update Version Packages PR
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          version-script: npm run changeset:version
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The Version Packages PR was permanently unmergeable (#9161 / #9381).
      # GitHub does not start workflow runs for events created with the default
      # GITHUB_TOKEN — the recursion guard — so the PR above opened with ZERO
      # Actions checks. The default-branch ruleset requires "CI Success", which
      # ci.yml only ever produced on `pull_request`, so the requirement could
      # never be satisfied and every run force-pushed the same branch into the
      # same dead state. Nothing was versioned or tagged for weeks, because
      # tag-release below only fires on a MERGED version-packages commit.
      #
      # `workflow_dispatch` is GitHub's documented exception to that guard: it
      # always creates a run, even when fired with GITHUB_TOKEN. So we dispatch
      # ci.yml at the release branch. Its checks attach to the branch head SHA —
      # the PR head SHA — and "CI Success" reports. No App, no PAT, no secret.
      #
      # Retried because the dispatch races the branch push: the ref has to be
      # visible to the Actions API before it will accept a dispatch for it.
      - name: Start CI on the release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: changeset-release/main
        run: |
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "No $BRANCH branch — nothing to run CI against."
            exit 0
          fi
          for attempt in 1 2 3; do
            if gh workflow run ci.yml --ref "$BRANCH"; then
              echo "Dispatched ci.yml on $BRANCH (attempt $attempt)."
              exit 0
            fi
            echo "Dispatch attempt $attempt failed; retrying in 10s."
            sleep 10
          done
          # Loud, not silent: without this run the PR has no "CI Success" and
          # cannot merge, so a failed dispatch must fail the job.
          echo "::error::Could not dispatch ci.yml on $BRANCH — the Version Packages PR will have no CI Success check."
          exit 1

  tag-release:
    name: Tag and Release
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-tag-release-${{ github.ref }}
      cancel-in-progress: false
    # Detect the Version Packages commit. Uses startsWith to handle squash merges
    # that append the PR number (e.g. "chore: version packages (#123)").
    # head_commit.message is safe here — used in an `if:` expression, not a shell command.
    if: "startsWith(github.event.head_commit.message, 'chore: version packages')"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Get version from web/package.json
        id: version
        run: |
          VERSION=$(node -p "require('./web/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # -- Gather state ----------------------------------------------------------
      - name: Check if tag already exists
        id: check-tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Check both local and remote tags (fetch-depth: 0 + fetch-tags: true
          # ensures local refs are complete, but also check remote as a safety net)
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check if release exists
        id: check-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog for this version
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ESCAPED_VERSION="${VERSION//./\\.}"
          BODY=""

          # Try per-package changelog first (where changesets writes by default)
          for CHANGELOG in web/CHANGELOG.md CHANGELOG.md; do
            if [ -f "$CHANGELOG" ]; then
              BODY=$(awk "/^## ${ESCAPED_VERSION}([[:space:]]|$)/{found=1; next} /^## /{if(found) exit} found" "$CHANGELOG")
              if [ -n "$BODY" ]; then
                break
              fi
            fi
          done

          if [ -z "$BODY" ]; then
            BODY="Release v${VERSION}"
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$BODY"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # -- Act ----------------------------------------------------------------
      - name: Create git tag
        if: steps.check-tag.outputs.exists == 'false'
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.check-release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
          BODY: ${{ steps.changelog.outputs.body }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$BODY"
