name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Restrict default token permissions (CWE-732 / CodeQL workflow-missing-permissions).
# Individual jobs add specific permissions only when needed.
permissions:
  contents: read

jobs:
  # ---- CI Gate ----
  # Always runs on every PR. Detects which paths changed and sets outputs
  # so downstream jobs can skip when not needed. The ruleset requires only
  # this check — it always posts a result, solving the path-filter + required-checks conflict.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      needs-web: ${{ steps.changes.outputs.web }}
      needs-engine: ${{ steps.changes.outputs.engine }}
      needs-mcp: ${{ steps.changes.outputs.mcp }}
      needs-ci: ${{ steps.changes.outputs.ci }}
      needs-docs: ${{ steps.changes.outputs.docs }}
      needs-design: ${{ steps.changes.outputs.design }}
      needs-hooks: ${{ steps.changes.outputs.hooks }}
      needs-deps: ${{ steps.changes.outputs.deps }}
      needs-any-code: ${{ steps.changes.outputs.any-code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          web=false; engine=false; mcp=false; ci=false; docs=false; design=false; hooks=false; deps=false

          echo "$CHANGED" | grep -q '^web/' && web=true
          echo "$CHANGED" | grep -q '^engine/' && engine=true
          echo "$CHANGED" | grep -q '^mcp-server/' && mcp=true
          echo "$CHANGED" | grep -qE '^\.github/workflows/|^scripts/|^package\.json|^package-lock\.json|^\.claude/skills/.*/scripts/' && ci=true
          echo "$CHANGED" | grep -qE '^apps/docs/|^mcp-server/manifest/' && docs=true
          echo "$CHANGED" | grep -qE '^apps/design/|^packages/ui/' && design=true
          # Claude Code hook scripts + their self-contained bash test suites.
          # Kept OUT of `ci` and any-code on purpose: a hook change must trigger
          # ONLY the lightweight hook-tests job, never the heavy quality-gates
          # fan-out (lint/typecheck/test-web/test-mcp/build-wasm).
          echo "$CHANGED" | grep -qE '^\.claude/hooks/' && hooks=true
          # Any package.json at ANY depth (web/, mcp-server/, apps/*, packages/*,
          # root) or the single root lockfile → run the lockfile-sync gate. Kept
          # ORTHOGONAL to any-code (like hooks): the gate is a ~30s self-contained
          # check, so a manifest-only change pays only this gate, not the full
          # quality-gates fan-out.
          echo "$CHANGED" | grep -qE '(^|/)package\.json$|^package-lock\.json$' && deps=true

          any_code=false
          if [ "$web" = "true" ] || [ "$engine" = "true" ] || [ "$mcp" = "true" ] || [ "$ci" = "true" ] || [ "$docs" = "true" ] || [ "$design" = "true" ]; then
            any_code=true
          fi

          {
            echo "web=$web"
            echo "engine=$engine"
            echo "mcp=$mcp"
            echo "ci=$ci"
            echo "docs=$docs"
            echo "design=$design"
            echo "hooks=$hooks"
            echo "deps=$deps"
            echo "any-code=$any_code"
          } >> "$GITHUB_OUTPUT"

          echo "Changed paths detected:"
          echo "  web=$web engine=$engine mcp=$mcp ci=$ci docs=$docs design=$design hooks=$hooks deps=$deps any-code=$any_code"
          if [ "$any_code" = "false" ] && [ "$hooks" = "false" ]; then
            echo "No relevant changes — downstream jobs will be skipped"
          fi

  # ---- Quality Gates (reusable workflow shared with CD) ----
  quality-gates:
    name: Quality Gates
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.needs-any-code == 'true' }}
    uses: ./.github/workflows/quality-gates.yml
    with:
      web-changed: ${{ fromJSON(needs.ci-gate.outputs.needs-web) }}
      engine-changed: ${{ fromJSON(needs.ci-gate.outputs.needs-engine) }}
      mcp-changed: ${{ fromJSON(needs.ci-gate.outputs.needs-mcp) }}
      ci-changed: ${{ fromJSON(needs.ci-gate.outputs.needs-ci) }}
      # PRs never run on main — the ratchet commit step is guarded by
      # github.ref == refs/heads/main so it is a no-op here, but false
      # makes the intent explicit.
      can-commit-ratchet: false
    secrets: inherit

  # ---- CI-only checks ----

  command-parity:
    name: MCP Command Parity
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.needs-web == 'true' || needs.ci-gate.outputs.needs-mcp == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Verify all MCP commands have handlers
        working-directory: web
        run: node scripts/check-command-parity.js

  build-nextjs:
    name: Next.js Production Build
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.needs-web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Build @spawnforge/ui
        run: cd packages/ui && npm run build

      - run: npm run build
        working-directory: web

      - name: Check JS bundle size
        working-directory: web
        run: node scripts/check-bundle-size.js

  # ---- Docs Internal Gate ----
  # Runs when apps/docs/** or mcp-server/manifest/** changed.
  # Verifies that no internal commands appear in generated public MDX and that
  # the two commands.json copies are in sync.
  # Path-gated so docs-only PRs pay the docs build tax (~2-3 min) but
  # Rust engine PRs that don't touch docs are unaffected.
  docs-internal-gate:
    name: Docs Internal Gate
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.needs-docs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install docs dependencies
        run: cd apps/docs && npm install

      - name: Run docs vitest suite
        run: cd apps/docs && npx vitest run

      - name: Generate MCP docs
        run: cd apps/docs && npx tsx scripts/generate-mcp-docs.ts

      - name: Assert no internal commands in generated MDX
        run: npx tsx apps/docs/scripts/ci-gate-check.ts

      - name: Verify MCP manifest sync
        run: npx tsx apps/docs/scripts/check-manifest-sync.ts

  # ---- Design Internal Gate ----
  # Runs when apps/design/** or packages/ui/** changed.
  # Builds Storybook to verify no compilation errors in design system changes.
  # Path-gated so design-only PRs pay the Storybook build tax but engine/web PRs
  # that don't touch the design system are unaffected.
  design-internal-gate:
    name: Design Internal Gate
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.needs-design == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Build @spawnforge/ui
        run: cd packages/ui && npm run build

      - name: Install design app dependencies
        run: cd apps/design && npm ci

      - name: Build Storybook
        run: cd apps/design && npx storybook build -o storybook-static

  # ---- Hook Tests ----
  # Runs when .claude/hooks/** changed. Executes the self-contained bash test
  # suites that guard the reviewer-loop hooks (reject-incomplete-review.sh and
  # review-quality-gate.sh), so a regression in their exit-code contract is
  # caught in CI instead of silently looping or letting incomplete reviews
  # through. Gated on its own `hooks` path output (NOT any-code) so hook-only
  # PRs pay only this ~30s gate, never the full quality-gates fan-out.
  hook-tests:
    name: Hook Tests
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.needs-hooks == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Run hook test suites
        run: |
          # jq + shellcheck are preinstalled on ubuntu-latest runners.
          shopt -s nullglob
          suites=(.claude/hooks/__tests__/*.test.sh)
          if [ ${#suites[@]} -eq 0 ]; then
            echo "::error::No hook test suites found under .claude/hooks/__tests__/"
            exit 1
          fi
          rc=0
          for suite in "${suites[@]}"; do
            echo "::group::$suite"
            bash "$suite" || rc=1
            echo "::endgroup::"
          done
          exit "$rc"

      - name: Shellcheck the hooks owned by this change
        run: |
          # Scope shellcheck to the hardened review hooks + their tests only.
          # The wider .claude/hooks/ tree carries pre-existing findings tracked
          # separately (see .claude/rules/agent-operations.md §12) — linting all
          # of it here would fail this gate on unrelated, untouched debt.
          shellcheck \
            .claude/hooks/reject-incomplete-review.sh \
            .claude/hooks/review-quality-gate.sh \
            .claude/hooks/__tests__/reject-incomplete-review.test.sh \
            .claude/hooks/__tests__/review-quality-gate.test.sh

  # ---- Lockfile Sync ----
  # Runs when any package.json (at any depth) or the root package-lock.json
  # changed. Regenerates the root lockfile from the manifests and fails if it
  # drifts from what is committed — catching the single-root-lockfile EUSAGE
  # breakage (a web/ or nested manifest bump without a relock) BEFORE it lands
  # on main, instead of after, when every `npm ci` is already broken. Shipped
  # twice this way (#8655, #8658 → #8683). Decision logic lives in
  # scripts/check-lockfile-sync.sh (unit-tested by the lockfile-sync-tests job below).
  #
  # Gated on its own `deps` output (NOT any-code) so a manifest-only PR pays
  # only this ~30s gate. Wired into ci-success below so it is a REQUIRED check
  # when it runs, yet is allowed to skip (result 'skipped', not a failure) on
  # PRs that touch no manifest — the safe path-filter + required-check pattern.
  lockfile-sync:
    name: Lockfile Sync
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.needs-deps == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check root lockfile is in sync with the manifests
        run: bash scripts/check-lockfile-sync.sh

  # ---- CI Self-Defense Tests ----
  # Unit-tests the decision logic of the repo's self-defending CI gates via
  # their co-located bash suites:
  #   * scripts/check-lockfile-sync.sh — the single-root lockfile-drift gate
  #     (injects a stub $LOCKFILE_REGEN_CMD to exercise the in-sync / drift /
  #     regen-failure branches hermetically) AND structurally asserts that gate
  #     is wired into the required ci-success aggregate below.
  #   * scripts/check-ci-success.sh — the ci-success verifier itself, including
  #     its anti-tamper check that a self-defending gate may not be `skipped`
  #     while its trigger fired (closes the one-line `if: false` unwiring vector).
  # These ride ci-success as a REQUIRED check rather than a standalone advisory
  # workflow: a standalone path-filtered suite can be left out of the required
  # aggregate, which would let a PR that neuters a gate script merge green.
  # Gated on `needs-ci` (fires on scripts/ and .github/workflows/ changes, see
  # ci-gate), so it runs whenever a gate, its suite, or ci.yml itself moves —
  # exactly when an unwiring would happen — and skips cleanly otherwise. The job
  # id stays `lockfile-sync-tests` so the ci-success `needs:` wiring is stable.
  lockfile-sync-tests:
    name: CI Self-Defense Tests
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.needs-ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Shellcheck the gate scripts and their suites
        run: |
          shellcheck \
            scripts/check-lockfile-sync.sh scripts/__tests__/check-lockfile-sync.test.sh \
            scripts/check-ci-success.sh scripts/__tests__/check-ci-success.test.sh

      - name: Run lockfile gate test suite
        run: bash scripts/__tests__/check-lockfile-sync.test.sh

      - name: Run ci-success verifier test suite
        run: bash scripts/__tests__/check-ci-success.test.sh

  # ---- Preview Deployment (PR only) ----
  # Deploys a Vercel preview for every PR so reviewers can test changes without
  # a local build. Only runs when VERCEL_DEPLOY_ENABLED is set and web/mcp files changed.
  preview-deploy:
    name: Preview Deployment
    needs: [ci-gate, quality-gates]
    # Skip for Dependabot PRs — repo secrets (VERCEL_TOKEN, VERCEL_TEAM_ID,
    # VERCEL_STAGING_PROJECT_ID) are not exposed to Dependabot-triggered runs,
    # so `vercel pull` fails with "No existing credentials found". Maintainers
    # who need a preview for a dep bump can rebase the branch onto a
    # maintainer branch or deploy manually via `vercel deploy`.
    if: |
      github.actor != 'dependabot[bot]' &&
      vars.VERCEL_DEPLOY_ENABLED == 'true' &&
      needs.quality-gates.result == 'success' &&
      (needs.ci-gate.outputs.needs-web == 'true' || needs.ci-gate.outputs.needs-mcp == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Vercel CLI
        run: npm i -g vercel@50.34.3

      - name: Install dependencies
        run: npm ci

      - name: Build @spawnforge/ui
        run: cd packages/ui && npm run build

      - name: Pull Vercel environment (preview)
        working-directory: web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Deploy directly instead of build+deploy-prebuilt.
          # vercel build uses child_process.spawn('npm') which fails on GHA
          # runners because setup-node's PATH isn't inherited by spawned
          # processes. vercel deploy builds remotely on Vercel infrastructure
          # where npm is always available.
          url=$(vercel deploy --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview deployment: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          short_sha="${COMMIT_SHA:0:8}"
          gh pr comment "$PR_NUMBER" \
            --body "**Preview deployment ready** — [\`${short_sha}\`](${DEPLOY_URL}): ${DEPLOY_URL}" \
            --repo "$REPO"

      - name: Verify preview is reachable
        if: steps.deploy.outputs.url
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          # Preview deployments sit behind Vercel Deployment Protection (#7994):
          # an unauthenticated request is answered by the SSO gate with HTTP 401
          # (server: Vercel, _vercel_sso_nonce cookie). That 401 PROVES the
          # deployment is live and serving — it is not an outage. A plain
          # `curl -sf` fails on any 4xx (exit 56), so it emitted false
          # "Preview URL not reachable" warnings on every protected preview.
          # Inspect the status code instead: only a missing response (000) or a
          # 5xx means the preview is genuinely unreachable.
          code=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 --max-time 30 "$PREVIEW_URL" || true)
          echo "Preview responded with HTTP $code"
          case "$code" in
            000|5??)
              echo "::warning::Preview URL not reachable (HTTP $code)"
              ;;
            401|403)
              echo "Preview is reachable — HTTP $code is the expected Vercel Deployment Protection (SSO) gate."
              ;;
            *)
              echo "Preview is reachable (HTTP $code)."
              ;;
          esac

  # Engine-dependent E2E tests (@engine) require WASM + GPU which CI runners lack.
  # Only UI-only E2E tests (@ui) run in CI — they test React shell without WASM.
  # Sharded across 3 parallel runners to stay well under the 30-min timeout.
  test-e2e-ui:
    name: E2E UI Tests (${{ matrix.shard }})
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.needs-web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Build @spawnforge/ui
        run: cd packages/ui && npm run build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          # Key on the REAL root lockfile. This is a single-root-lockfile
          # monorepo: web/package-lock.json does not exist, so the old key
          # hashFiles('web/package-lock.json') returned '' — a constant
          # `playwright-` key that never invalidated, leaving stale browser
          # caches that intermittently failed with "Executable doesn't exist"
          # when Playwright's required browser revision changed. (#8589)
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium

      - name: Build for E2E
        working-directory: web
        env:
          SKIP_ENV_VALIDATION: 'true'
        run: npx next build

      - name: Run UI-only E2E tests (shard ${{ matrix.shard }})
        working-directory: web
        env:
          SKIP_ENV_VALIDATION: 'true'
        run: npx playwright test --grep '@ui' --grep-invert '@dev' --project=chromium --config playwright.ci.config.ts --shard=${{ matrix.shard }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ strategy.job-index }}
          path: web/blob-report/
          retention-days: 7

  # Merge sharded E2E reports into a single HTML report
  merge-e2e-reports:
    name: Merge E2E Reports
    needs: [test-e2e-ui]
    if: ${{ !cancelled() && needs.test-e2e-ui.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Download blob reports
        # Must match the upload-artifact major version used for blob-report-*
        # above (@v4) — mixing artifact action majors is a documented gotcha.
        uses: actions/download-artifact@v4
        with:
          path: web/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge reports
        working-directory: web
        run: npx playwright merge-reports --reporter=html ./all-blob-reports

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: web/playwright-report/
          retention-days: 14

  # ---- CI Success (aggregating required check) ----
  # Audit 2026-05-30 (F01): branch protection previously required ONLY ci-gate,
  # a no-op path detector that always passes — so a PR could merge with failing
  # eslint/tsc/vitest/coverage/build because those jobs were conditionally
  # skipped and not individually required. This job depends on every REAL gate
  # and fails if any of them failed or was cancelled. A path-gated job that is
  # legitimately skipped is allowed (result 'skipped' is not a failure).
  #
  # ACTION REQUIRED (user, one-time): make THIS job ("CI Success") the required
  # status check in the `main` branch-protection ruleset, replacing/​alongside
  # "CI Gate". Code cannot change branch-protection settings.
  #
  # preview-deploy (deployment, vars-gated) and merge-e2e-reports (reporting
  # only) are intentionally excluded — neither gates correctness.
  ci-success:
    name: CI Success
    if: ${{ always() }}
    needs:
      - ci-gate
      - quality-gates
      - command-parity
      - build-nextjs
      - docs-internal-gate
      - design-internal-gate
      - hook-tests
      - lockfile-sync
      - lockfile-sync-tests
      - test-e2e-ui
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # The verify logic lives in scripts/check-ci-success.sh (unit-tested by the
      # lockfile-sync-tests job) so it can be exercised hermetically and so the
      # anti-tamper check — a self-defending gate must not be `skipped` while its
      # trigger fired — can't be silently reverted to a skip-tolerant inline jq.
      - name: Verify all required gates passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash scripts/check-ci-success.sh
