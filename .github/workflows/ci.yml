name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Restrict default token permissions (CWE-732 / CodeQL workflow-missing-permissions).
# Individual jobs add specific permissions only when needed.
permissions:
  contents: read

jobs:
  # ---- CI Gate ----
  # Always runs on every PR. Detects which paths changed and sets outputs
  # so downstream jobs can skip when not needed. The ruleset requires only
  # this check — it always posts a result, solving the path-filter + required-checks conflict.
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      needs-web: ${{ steps.changes.outputs.web }}
      needs-engine: ${{ steps.changes.outputs.engine }}
      needs-mcp: ${{ steps.changes.outputs.mcp }}
      needs-ci: ${{ steps.changes.outputs.ci }}
      needs-docs: ${{ steps.changes.outputs.docs }}
      needs-design: ${{ steps.changes.outputs.design }}
      needs-hooks: ${{ steps.changes.outputs.hooks }}
      needs-deps: ${{ steps.changes.outputs.deps }}
      needs-agentic: ${{ steps.changes.outputs.agentic }}
      needs-onboarding: ${{ steps.changes.outputs.onboarding }}
      needs-codex: ${{ steps.changes.outputs.codex }}
      needs-ghaw: ${{ steps.changes.outputs.ghaw }}
      needs-api: ${{ steps.changes.outputs.api }}
      needs-skills: ${{ steps.changes.outputs.skills }}
      needs-any-code: ${{ steps.changes.outputs.any-code }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          web=false; engine=false; mcp=false; ci=false; docs=false; design=false; hooks=false; deps=false; agentic=false; onboarding=false; codex=false; ghaw=false; api=false; skills=false

          echo "$CHANGED" | grep -q '^web/' && web=true
          echo "$CHANGED" | grep -q '^engine/' && engine=true
          echo "$CHANGED" | grep -q '^mcp-server/' && mcp=true
          echo "$CHANGED" | grep -qE '^\.github/workflows/|^scripts/|^package\.json|^package-lock\.json|^\.claude/skills/.*/scripts/' && ci=true
          echo "$CHANGED" | grep -qE '^apps/docs/|^mcp-server/manifest/' && docs=true
          echo "$CHANGED" | grep -qE '^apps/design/|^packages/ui/' && design=true
          # Claude Code hook scripts + their self-contained bash test suites,
          # plus .claude/settings.json (the committed permissions posture, which
          # settings-permissions.test.sh validates). Kept OUT of `ci` and
          # any-code on purpose: a hook/settings change never fires the heavy
          # quality-gates fan-out (lint/typecheck/test-web/test-mcp/build-wasm).
          # It does fire hook-tests (this output) AND — because the `onboarding`
          # matcher below also lists `^\.claude/` — the lightweight
          # onboarding-guard + lockfile-sync-tests self-tests. All three are fast,
          # self-contained checks; the fan-out is what stays gated off.
          echo "$CHANGED" | grep -qE '^\.claude/hooks/|^\.claude/settings\.json$' && hooks=true
          # Any package.json at ANY depth (web/, mcp-server/, apps/*, packages/*,
          # root) or the single root lockfile → run the lockfile-sync gate. Kept
          # ORTHOGONAL to any-code (like hooks): the gate is a ~30s self-contained
          # check, so a manifest-only change pays only this gate, not the full
          # quality-gates fan-out.
          echo "$CHANGED" | grep -qE '(^|/)package\.json$|^package-lock\.json$' && deps=true
          # Cross-provider agentic-config drift gate (scripts/check-agentic-sync.sh).
          # Fires on the single source of truth (tools/agentic-sync/), the
          # per-provider instruction files it injects facts into, the gate script
          # itself, or the cross-provider DX-audit tool that delegates to the gate
          # (.claude/tools/dx-audit.sh + its contract test). Kept ORTHOGONAL to
          # any-code (like hooks/deps): an instruction-file-only edit pays only this
          # ~5s check, never the heavy quality-gates fan-out. (check-agentic-sync.sh
          # also matches `ci` above, which is fine — editing a gate script warrants
          # the wider run; .claude/tools/dx-audit.sh matches neither ci nor hooks,
          # so wiring it here is what makes its contract test run at all.)
          echo "$CHANGED" | grep -qE '^tools/agentic-sync/|^AGENTS\.md$|^\.github/copilot-instructions\.md$|^\.codex/AGENTS\.md$|^\.cursorrules$|^scripts/check-agentic-sync\.sh$|^\.claude/tools/dx-audit\.sh$|^\.claude/tools/__tests__/dx-audit\.test\.sh$' && agentic=true
          # Taskboard onboarding-hygiene tripwire (scripts/check-taskboard-onboarding-hygiene.sh).
          # Fires whenever a CONTRIBUTOR-FACING ONBOARDING SURFACE changes — the
          # surfaces where a rotated taskboard project/team ULID or a forbidden
          # `--db` start command has historically been copy-pasted and which the
          # agentic-sync generator's marker injection cannot reach: every provider
          # instruction dir (.claude .codex .gemini .github .windsurf .agent .agents),
          # the root instruction/onboarding docs (AGENTS.md GEMINI.md .cursorrules
          # README CONTRIBUTING), docs/, the canonical source of truth, and the
          # tripwire's own files. Kept ORTHOGONAL to any-code (like hooks/deps/
          # agentic): a docs-only onboarding edit pays only this ~1s, zero-dep,
          # read-only grep, never the heavy quality-gates fan-out. (The threat model
          # from the parity review is onboarding surfaces specifically; a dead ID in
          # a non-onboarding file is still caught on any PR that also touches one of
          # these surfaces or a gate script.)
          echo "$CHANGED" | grep -qE '^README\.md$|^CONTRIBUTING\.md$|^AGENTS\.md$|^GEMINI\.md$|^\.cursorrules$|^\.claude/|^\.codex/|^\.gemini/|^\.github/|^\.windsurf/|^\.agent/|^\.agents/|^docs/|^tools/agentic-sync/|^scripts/check-taskboard-onboarding-hygiene\.sh$|^scripts/__tests__/check-taskboard-onboarding-hygiene\.test\.sh$' && onboarding=true
          # Codex permissive-profile guard (scripts/check-codex-config-safety.sh).
          # Fires ONLY on the committed Codex config under test or the guard/its
          # test — a ~1s, zero-dep, read-only `git show HEAD:` check. Kept
          # ORTHOGONAL to any-code (like hooks/deps/agentic/onboarding): a
          # config-only edit pays only this guard, never the heavy fan-out. The
          # guard reads the COMMITTED blob, so it asserts "is the profile being
          # merged permissive?" rather than inspecting the working tree.
          echo "$CHANGED" | grep -qE '^\.codex/config\.toml$|^scripts/check-codex-config-safety\.sh$|^scripts/__tests__/check-codex-config-safety\.test\.sh$' && codex=true
          # Claude Code skill best-practices linter (scripts/check-skills.sh). Fires
          # on ANY skill file (.claude/skills/**, both SKILL.md and scripts/) or the
          # gate's own files (linter + ratchet baseline). Kept ORTHOGONAL to any-code
          # (like hooks/deps): a skill-only edit pays only this ~2s, zero-dep linter,
          # never the heavy quality-gates fan-out. New/touched skills must lint clean;
          # legacy/imported debt is tracked in scripts/check-skills-baseline.txt.
          # (A skill SCRIPT change also matches `ci` above — editing a script warrants
          # the wider run; a SKILL.md-only change matches neither ci nor hooks, so
          # wiring it here is what makes the linter run on doc-only skill edits.)
          echo "$CHANGED" | grep -qE '^\.claude/skills/|^scripts/check-skills\.sh$|^scripts/check-skills-baseline\.txt$|^scripts/__tests__/check-skills\.test\.sh$' && skills=true
          # gh-aw lock-drift gate (scripts/check-ghaw-lock-sync.sh). Fires on a
          # gh-aw workflow SOURCE (.github/workflows/*.md), its generated sibling
          # (.github/workflows/*.lock.yml), the SHA-pinned action manifest the
          # compiler injects from (.github/aw/), or the guard/its test. An action-pin
          # bump under .github/aw/ drifts the locks with no .md edit, so it MUST be a
          # trigger surface. These paths also set `ci` (^\.github/workflows/) and/or
          # `onboarding` (^\.github/), so needs-ghaw ⟹ (needs-ci ∨ needs-onboarding) —
          # which is what lets the gate's self-test ride the lockfile-sync-tests job
          # without widening that job's if:.
          echo "$CHANGED" | grep -qE '^\.github/workflows/.*\.md$|^\.github/workflows/.*\.lock\.yml$|^\.github/aw/|^scripts/check-ghaw-lock-sync\.sh$|^scripts/get-ghaw-compiler-version\.sh$|^scripts/__tests__/check-ghaw-lock-sync\.test\.sh$' && ghaw=true
          # OpenAPI route-drift gate (scripts/check-openapi-route-sync.sh). Fires on
          # any API route (web/src/app/api/**, which also sets `web`), the published
          # spec (docs/api/openapi.json — a malformed spec 500s /api/openapi in prod
          # and breaks Swagger UI at /api-docs), the internal-routes allowlist, or the
          # gate/its test. The spec + allowlist live under docs/ (also set
          # `onboarding`) and the gate script under scripts/ (also sets `ci`), so
          # needs-api ⟹ (needs-web ∨ needs-onboarding ∨ needs-ci) — which lets the
          # gate's self-test ride the lockfile-sync-tests job (needs-ci) without
          # widening that job's if:. Kept as its own output so a spec/allowlist-only
          # PR still runs the gate even when no route.ts changed.
          echo "$CHANGED" | grep -qE '^web/src/app/api/|^docs/api/openapi\.json$|^docs/api/openapi-internal-routes\.json$|^scripts/check-openapi-route-sync\.sh$|^scripts/__tests__/check-openapi-route-sync\.test\.sh$' && api=true

          any_code=false
          if [ "$web" = "true" ] || [ "$engine" = "true" ] || [ "$mcp" = "true" ] || [ "$ci" = "true" ] || [ "$docs" = "true" ] || [ "$design" = "true" ]; then
            any_code=true
          fi

          {
            echo "web=$web"
            echo "engine=$engine"
            echo "mcp=$mcp"
            echo "ci=$ci"
            echo "docs=$docs"
            echo "design=$design"
            echo "hooks=$hooks"
            echo "deps=$deps"
            echo "agentic=$agentic"
            echo "onboarding=$onboarding"
            echo "codex=$codex"
            echo "ghaw=$ghaw"
            echo "api=$api"
            echo "skills=$skills"
            echo "any-code=$any_code"
          } >> "$GITHUB_OUTPUT"

          echo "Changed paths detected:"
          echo "  web=$web engine=$engine mcp=$mcp ci=$ci docs=$docs design=$design hooks=$hooks deps=$deps agentic=$agentic onboarding=$onboarding codex=$codex ghaw=$ghaw api=$api skills=$skills any-code=$any_code"
          if [ "$any_code" = "false" ] && [ "$hooks" = "false" ] && [ "$deps" = "false" ] && [ "$api" = "false" ] && [ "$skills" = "false" ]; then
            echo "No relevant changes — downstream jobs will be skipped"
          fi

  # ---- Quality Gates (reusable workflow shared with CD) ----
  quality-gates:
    name: Quality Gates
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.needs-any-code == 'true' }}
    uses: ./.github/workflows/quality-gates.yml
    with:
      web-changed: ${{ fromJSON(needs.ci-gate.outputs.needs-web) }}
      engine-changed: ${{ fromJSON(needs.ci-gate.outputs.needs-engine) }}
      mcp-changed: ${{ fromJSON(needs.ci-gate.outputs.needs-mcp) }}
      ci-changed: ${{ fromJSON(needs.ci-gate.outputs.needs-ci) }}
      # PRs never run on main — the ratchet commit step is guarded by
      # github.ref == refs/heads/main so it is a no-op here, but false
      # makes the intent explicit.
      can-commit-ratchet: false
    secrets: inherit

  # ---- CI-only checks ----

  command-parity:
    name: MCP Command Parity
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.needs-web == 'true' || needs.ci-gate.outputs.needs-mcp == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify all MCP commands have handlers
        working-directory: web
        run: node scripts/check-command-parity.js

  build-nextjs:
    name: Next.js Production Build
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.needs-web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Build @spawnforge/ui
        run: cd packages/ui && npm run build

      - run: npm run build
        working-directory: web

      - name: Check JS bundle size
        working-directory: web
        run: node scripts/check-bundle-size.js

  # ---- Docs Internal Gate ----
  # Runs when apps/docs/** or mcp-server/manifest/** changed.
  # Verifies that no internal commands appear in generated public MDX and that
  # the two commands.json copies are in sync.
  # Path-gated so docs-only PRs pay the docs build tax (~2-3 min) but
  # Rust engine PRs that don't touch docs are unaffected.
  docs-internal-gate:
    name: Docs Internal Gate
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.needs-docs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install docs dependencies
        run: cd apps/docs && npm install

      - name: Run docs vitest suite
        run: cd apps/docs && npx vitest run

      - name: Generate MCP docs
        run: cd apps/docs && npx tsx scripts/generate-mcp-docs.ts

      - name: Assert no internal commands in generated MDX
        run: npx tsx apps/docs/scripts/ci-gate-check.ts

      - name: Verify MCP manifest sync
        run: npx tsx apps/docs/scripts/check-manifest-sync.ts

  # ---- Design Internal Gate ----
  # Runs when apps/design/** or packages/ui/** changed.
  # Builds Storybook to verify no compilation errors in design system changes.
  # Path-gated so design-only PRs pay the Storybook build tax but engine/web PRs
  # that don't touch the design system are unaffected.
  design-internal-gate:
    name: Design Internal Gate
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.needs-design == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Build @spawnforge/ui
        run: cd packages/ui && npm run build

      - name: Install design app dependencies
        run: cd apps/design && npm ci

      - name: Build Storybook
        run: cd apps/design && npx storybook build -o storybook-static

  # ---- Hook Tests ----
  # Runs when .claude/hooks/** changed. Executes the self-contained bash test
  # suites that guard the reviewer-loop hooks (reject-incomplete-review.sh and
  # review-quality-gate.sh), so a regression in their exit-code contract is
  # caught in CI instead of silently looping or letting incomplete reviews
  # through. Gated on its own `hooks` path output (NOT any-code) so hook-only
  # PRs pay only this ~30s gate, never the full quality-gates fan-out.
  hook-tests:
    name: Hook Tests
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.needs-hooks == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run hook test suites
        run: |
          # jq + shellcheck are preinstalled on ubuntu-latest runners.
          shopt -s nullglob
          suites=(.claude/hooks/__tests__/*.test.sh)
          if [ ${#suites[@]} -eq 0 ]; then
            echo "::error::No hook test suites found under .claude/hooks/__tests__/"
            exit 1
          fi
          rc=0
          for suite in "${suites[@]}"; do
            echo "::group::$suite"
            bash "$suite" || rc=1
            echo "::endgroup::"
          done
          exit "$rc"

      - name: Shellcheck the hooks owned by this change
        run: |
          # Scope shellcheck to the hooks this gate owns + their tests: the
          # hardened review-loop hooks and the auto-approve permission gate.
          # The wider .claude/hooks/ tree carries pre-existing findings tracked
          # separately (see .claude/rules/agent-operations.md §12) — linting all
          # of it here would fail this gate on unrelated, untouched debt. Newly
          # added or edited hooks MUST be shellcheck-clean, so they go here.
          shellcheck \
            .claude/hooks/reject-incomplete-review.sh \
            .claude/hooks/review-quality-gate.sh \
            .claude/hooks/auto-approve-safe-commands.sh \
            .claude/hooks/__tests__/reject-incomplete-review.test.sh \
            .claude/hooks/__tests__/review-quality-gate.test.sh \
            .claude/hooks/__tests__/auto-approve-safe-commands.test.sh \
            .claude/hooks/__tests__/settings-permissions.test.sh

  # ---- Skills Lint ----
  # Runs when any skill file (.claude/skills/**) or the linter/baseline changed.
  # check-skills.sh enforces skill best practices — frontmatter on line 1, name↔dir
  # match, kebab-case name, a meaningful description, a non-empty body, resolvable
  # relative links, and executable + shellcheck-clean scripts. New or touched skills
  # must lint clean; pre-existing legacy/imported debt is tracked in
  # scripts/check-skills-baseline.txt (a ratchet — only NEW drift fails). Gated on
  # its own `skills` output (NOT any-code) so a skill-only PR pays only this ~2s
  # gate. Wired into ci-success below so it is REQUIRED when it runs yet skips
  # cleanly on PRs that touch no skill — the safe path-filter + required pattern.
  skills-lint:
    name: Skills Lint
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.needs-skills == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Shellcheck the linter + its test
        # shellcheck is preinstalled on ubuntu-latest. The linter that enforces
        # script cleanliness on every skill must itself be clean.
        run: shellcheck scripts/check-skills.sh scripts/__tests__/check-skills.test.sh

      - name: Unit-test the linter's ratchet logic
        # The baseline/anti-rot decision logic is non-trivial — test it
        # hermetically (temp skills tree via the $SKILLS_DIR seam) so a
        # regression in the ratchet fails here, not silently on a real PR.
        run: bash scripts/__tests__/check-skills.test.sh

      - name: Lint all skills
        run: bash scripts/check-skills.sh

  # ---- Lockfile Sync ----
  # Runs when any package.json (at any depth) or the root package-lock.json
  # changed. Regenerates the root lockfile from the manifests and fails if it
  # drifts from what is committed — catching the single-root-lockfile EUSAGE
  # breakage (a web/ or nested manifest bump without a relock) BEFORE it lands
  # on main, instead of after, when every `npm ci` is already broken. Shipped
  # twice this way (#8655, #8658 → #8683). Decision logic lives in
  # scripts/check-lockfile-sync.sh (unit-tested by the lockfile-sync-tests job below).
  #
  # Gated on its own `deps` output (NOT any-code) so a manifest-only PR pays
  # only this ~30s gate. Wired into ci-success below so it is a REQUIRED check
  # when it runs, yet is allowed to skip (result 'skipped', not a failure) on
  # PRs that touch no manifest — the safe path-filter + required-check pattern.
  lockfile-sync:
    name: Lockfile Sync
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.needs-deps == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Check root lockfile is in sync with the manifests
        run: bash scripts/check-lockfile-sync.sh

  # ---- OpenAPI Route Drift ----
  # Runs when any API route (web/src/app/api/**), the published OpenAPI spec
  # (docs/api/openapi.json), the internal-routes allowlist, or the gate/its test
  # changed. Validates the spec is well-formed JSON — a malformed spec (e.g. a
  # trailing comma) makes web/src/app/api/openapi/route.ts JSON.parse throw, so
  # /api/openapi 500s in production and Swagger UI at /api-docs breaks (shipped
  # live on main) — AND asserts every route file is documented in the spec OR
  # listed in the internal-routes allowlist, so a new undocumented route fails the
  # PR instead of silently rotting the published contract. A read-only check (it
  # never edits the spec). Decision logic lives in
  # scripts/check-openapi-route-sync.sh (unit-tested by the lockfile-sync-tests
  # job below).
  #
  # Gated on its own `api` output (kept ORTHOGONAL so a spec/allowlist-only PR pays
  # only this ~5s, zero-dep gate, not the heavy quality-gates fan-out) and wired
  # into ci-success below so it is REQUIRED when it runs yet skips cleanly (result
  # 'skipped', not a failure) on PRs that touch no API surface.
  openapi-route-sync:
    name: OpenAPI Route Sync
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.needs-api == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check OpenAPI spec is valid and in sync with API routes
        run: bash scripts/check-openapi-route-sync.sh

  # ---- Agentic Config Sync ----
  # Runs when the single source of truth (tools/agentic-sync/canonical.json), the
  # generator, the per-provider instruction files it injects facts into
  # (AGENTS.md, .github/copilot-instructions.md, .codex/AGENTS.md, .cursorrules),
  # or the gate script change. Re-runs the generator in --check mode and fails the
  # PR if any provider file drifted from the source — so a stale taskboard Project
  # ID, a dead team ID, or a forbidden `--db` start command can never be
  # hand-mirrored into a non-Claude contributor's onboarding file again. Decision
  # logic lives in scripts/check-agentic-sync.sh + tools/agentic-sync/sync.mjs
  # (unit-tested by the CI Self-Defense Tests job below).
  #
  # Gated on its own `agentic` output (NOT any-code) so an instruction-file-only
  # PR pays only this ~5s gate. Wired into ci-success below so it is REQUIRED when
  # it runs yet skips cleanly when no agentic-config file is touched. The generator
  # is zero-dependency (node: builtins only), so no `npm ci` is needed.
  agentic-sync:
    name: Agentic Config Sync
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.needs-agentic == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version

      - name: Check provider instruction files are in sync with canonical.json
        run: bash scripts/check-agentic-sync.sh

  # ---- Taskboard Onboarding Hygiene ----
  # The negative guard the parity review called for: greps the WHOLE tree and
  # fails the PR if a stale taskboard onboarding FACT the agentic-sync generator
  # cannot reach reappears anywhere —
  #   (1) a rotated/dead project or team ULID (404s; the board-summary hook
  #       silently filtered to a dead project and reported zero work), or
  #   (2) a forbidden `--db .claude/taskboard.db` flag passed to `taskboard start`
  #       (creates an EMPTY local DB → the board shows 0 tickets).
  # The generator keeps the canonical FACTS BLOCK in sync across the 4 primary
  # onboarding files, but it cannot reach a fact embedded inline in a curl
  # command, a markdown table row, a code fence, or a non-target provider file
  # (.windsurf, .agent, .agents). This tripwire closes that gap. Decision logic +
  # the two-home allowlist (the parity-review doc; legacyProjectIds in
  # github-sync-config.json) live in scripts/check-taskboard-onboarding-hygiene.sh
  # (unit-tested by the CI Self-Defense Tests job below). It is a CHECK, never a fix.
  #
  # Gated on its own `onboarding` output (NOT any-code) so a docs/instruction-only
  # PR pays only this ~1s, zero-dep, read-only grep. Wired into ci-success below so
  # it is REQUIRED when it runs yet skips cleanly when no onboarding surface is
  # touched — the safe path-filter + required-check pattern.
  taskboard-onboarding-guard:
    name: Taskboard Onboarding Hygiene
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.needs-onboarding == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check for stale taskboard IDs and forbidden --db start commands
        run: bash scripts/check-taskboard-onboarding-hygiene.sh

  # ---- Codex Config Safety ----
  # Pure defense-in-depth (parity review gap Settings#0): fails the PR if the
  # COMMITTED .codex/config.toml ever ships the fully-unattended, network-open
  # combo — approval_policy = "never" AND network_access = true — which lets a
  # Codex agent run shell with no human approval gate while reaching the network.
  # The safe committed profile is approval-gated with the network off; this guard
  # passes on it and only trips if a permissive profile is committed.
  #
  # It reads the COMMITTED blob via `git show HEAD:.codex/config.toml`, NEVER the
  # working tree — a permissive profile may legitimately exist as an UNCOMMITTED
  # local edit, and reading the working copy would both touch that off-limits file
  # and false-fail locally. In CI the checkout == the ref under test, so this is
  # exactly "is the profile being merged permissive?". Decision logic lives in
  # scripts/check-codex-config-safety.sh (unit-tested by the CI Self-Defense Tests
  # job below). It is a CHECK, never a fix.
  #
  # Gated on its own `codex` output (NOT any-code) so a config-only PR pays only
  # this ~1s, zero-dep, read-only check. Wired into ci-success below so it is
  # REQUIRED when it runs yet skips cleanly when no Codex config surface is touched
  # — the safe path-filter + required-check pattern.
  codex-config-guard:
    name: Codex Config Safety
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.needs-codex == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The guard reads `git show HEAD:.codex/config.toml`; a full history is
          # not needed, but the committed blob at the checked-out ref must exist.
          fetch-depth: 1

      - name: Reject a committed permissive Codex config profile
        run: bash scripts/check-codex-config-safety.sh

  # ---- gh-aw Lock Sync ----
  # Fails the PR when a GitHub Agentic Workflow source (.github/workflows/*.md) or
  # an injected action pin (.github/aw/) changed without recompiling its generated
  # .lock.yml — the gh-aw analogue of the Lockfile Sync gate. Path-gated on
  # needs-ghaw and wired into the required ci-success aggregate (same safe pattern
  # as the other guards), so it is required when it runs and skips cleanly
  # otherwise. UNLIKE the other guards it needs the real gh-aw compiler, so it
  # installs the extension PINNED to the compiler version recorded in the committed
  # locks (a floating @latest would recompile to different output and false-fail on
  # drift the contributor never introduced). The gate recompiles and fails on any
  # source↔lock diff; it restores the tree afterward (a check, not a fix).
  ghaw-lock-sync:
    name: gh-aw Lock Sync
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.needs-ghaw == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1

      - name: Install the gh-aw extension (pinned to the committed compiler version)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Derive the pin from the committed locks (highest recorded
          # compiler_version, fallback if none) so the CI toolchain can never
          # silently skew from the compiler that produced them. The derivation
          # lives in a standalone, unit-tested helper rather than inline here, so
          # a regression in its regex/sort/fallback fails a required check instead
          # of shipping green (see scripts/get-ghaw-compiler-version.sh).
          ver="$(bash scripts/get-ghaw-compiler-version.sh)"
          # The helper is contracted to never emit empty (it falls back to a
          # known-good pin), but guard anyway: an empty $ver would make
          # `--pin ""` install whatever HEAD resolves to, silently defeating the
          # pin. Fail loudly instead of compiling locks with an unknown version.
          if [ -z "$ver" ]; then
            echo "::error::get-ghaw-compiler-version.sh emitted no version — refusing to install gh-aw unpinned"
            exit 1
          fi
          echo "Pinning gh-aw to $ver"
          # NOTE: `gh extension install --pin` pins to a git TAG/ref, not a content
          # SHA — gh has no flag to pin an extension by commit digest. The tag is
          # the same artifact the locks record, so this keeps the compiler aligned
          # with the committed locks; it is not a supply-chain SHA pin and does not
          # claim to be. (Tightening to a digest would require vendoring the
          # extension, which is out of scope for this drift gate.)
          gh extension install github/gh-aw --pin "$ver"
          # Verify the extension is actually runnable after install — a silent
          # install failure here would make the drift gate below fail with a
          # confusing "compile command failed" instead of a clear install error.
          gh aw version || { echo "::error::gh aw extension verification failed after install"; exit 1; }

      - name: Reject drift between gh-aw sources and their compiled .lock.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/check-ghaw-lock-sync.sh

  # ---- Actions SHA-Pin Guard ----
  # Fails the PR when a hand-written workflow references a GitHub Action by a
  # MUTABLE tag (e.g. `actions/checkout@v4`) instead of a 40-char commit SHA —
  # the supply-chain hole audit finding F35 (#8627) closed by SHA-pinning every
  # ref. A mutable tag lets a compromised or force-pushed upstream tag run
  # arbitrary code in CI with our secrets; a SHA pin freezes the exact tree.
  # Decision logic lives in scripts/check-actions-pinned.sh (the gh-aw generated
  # *.lock.yml files are excluded there — their pins are owned by the gh-aw Lock
  # Sync gate above). A read-only check, never a fix.
  #
  # Gated on `needs-ci` (any .github/workflows/** or scripts/** change — exactly
  # this guard's surface; a workflow edit already forces the full fan-out, so a
  # dedicated orthogonal output would buy nothing). Wired into ci-success below —
  # and into the anti-tamper map in scripts/check-ci-success.sh — so it is
  # REQUIRED when it runs, skips cleanly otherwise, and cannot be silently
  # `if: false`-unwired while its trigger fired (same self-defending pattern as
  # the gates above).
  actions-pin-check:
    name: Actions Pin Check
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.needs-ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify all workflow actions are SHA-pinned
        run: bash scripts/check-actions-pinned.sh

  # ---- CI Self-Defense Tests ----
  # Unit-tests the decision logic of the repo's self-defending CI gates via
  # their co-located bash suites:
  #   * scripts/check-lockfile-sync.sh — the single-root lockfile-drift gate
  #     (injects a stub $LOCKFILE_REGEN_CMD to exercise the in-sync / drift /
  #     regen-failure branches hermetically) AND structurally asserts that gate
  #     is wired into the required ci-success aggregate below.
  #   * scripts/check-ci-success.sh — the ci-success verifier itself, including
  #     its anti-tamper check that a self-defending gate may not be `skipped`
  #     while its trigger fired (closes the one-line `if: false` unwiring vector).
  #   * scripts/check-agentic-sync.sh + tools/agentic-sync/sync.mjs — the
  #     cross-provider agentic-config drift gate (exercised against hermetic
  #     fixtures, plus the same structural anti-unwiring assertions).
  #   * scripts/check-taskboard-onboarding-hygiene.sh — the taskboard
  #     onboarding-hygiene tripwire (stale ULIDs + forbidden `--db` start),
  #     exercised against hermetic fixture trees via the STALE_ID_SCAN_ROOT seam,
  #     plus the same structural anti-unwiring assertions.
  #   * scripts/check-codex-config-safety.sh — the Codex permissive-profile guard
  #     (rejects a COMMITTED approval_policy="never" + network_access=true combo),
  #     exercised against hermetic fixtures via the CODEX_CONFIG_PATH seam and a
  #     throwaway git repo via CODEX_CONFIG_SCAN_ROOT, plus the same structural
  #     anti-unwiring assertions.
  #   * scripts/check-ghaw-lock-sync.sh — the gh-aw lock-drift gate (rejects a
  #     .github/workflows/*.md source or .github/aw/ action-pin change that was not
  #     recompiled into its .lock.yml), exercised against a throwaway git repo via
  #     the GHAW_COMPILE_CMD stub seam, plus the same structural anti-unwiring
  #     assertions. Its companion scripts/get-ghaw-compiler-version.sh (which the
  #     ghaw-lock-sync job calls to pick the compiler pin from the committed locks)
  #     is unit-tested by the same suite and shellchecked alongside it.
  #   * .claude/tools/dx-audit.sh — the cross-provider DX audit; its contract test
  #     pins that the audit delegates to the agentic gate and covers the secondary
  #     provider surfaces (.codex/AGENTS.md, .windsurf, .agents) instead of drifting.
  # These ride ci-success as a REQUIRED check rather than a standalone advisory
  # workflow: a standalone path-filtered suite can be left out of the required
  # aggregate, which would let a PR that neuters a gate script merge green.
  # Gated on `needs-ci` (scripts/ and .github/workflows/ changes) OR `needs-agentic`
  # (the agentic source-of-truth generator under tools/agentic-sync/) OR
  # `needs-onboarding` (any contributor-facing onboarding surface — the tripwire's
  # own self-tests must re-run when onboarding files move), so it runs whenever any
  # gate, its suite, the generator, an onboarding surface, or ci.yml itself moves —
  # exactly when an unwiring would happen — and skips cleanly otherwise. The Codex
  # guard's own trigger, needs-codex, is named here as a fourth, EXPLICIT arm even
  # though its paths (.codex/config.toml — which also sets needs-onboarding via
  # `^\.codex/` — and the guard/test scripts — which set needs-ci) are today a
  # strict subset of the first three: relying on that subset is an untested,
  # silently-load-bearing invariant. If a future path-filter edit ever narrowed
  # needs-ci or needs-onboarding so a Codex-only change stopped setting them, this
  # suite — which runs the Codex guard's own tests — would skip while needs-codex
  # fired, and check-ci-success.sh's anti-tamper map (which DOES list needs-codex
  # for this job) would then flag a phantom unwiring on every Codex-only PR. Naming
  # needs-codex in both the `if:` and the anti-tamper map keeps the trigger set and
  # the tamper map identical, so the self-test re-runs on any Codex-config change
  # without depending on the subset holding.
  #
  # needs-ghaw is deliberately NOT a fifth arm here. Unlike needs-codex, it maps to
  # the STANDALONE `ghaw-lock-sync` job (gated on its own `if: needs-ghaw == 'true'`
  # and listed under that job's name in check-ci-success.sh's anti-tamper map), so
  # there is no if:/map mismatch forcing it to be named here — the phantom-unwiring
  # pressure that justified the needs-codex arm simply does not exist for needs-ghaw.
  # The gh-aw guard's own unit suite still re-runs in THIS job whenever it could be
  # touched, via the documented subset: needs-ghaw fires on .github/workflows/*.md
  # or *.lock.yml (both set needs-ci via `^\.github/workflows/`), on .github/aw/**
  # (sets needs-onboarding), or on a guard/test edit under scripts/ (sets needs-ci)
  # — all of which already trigger this job. The job id stays `lockfile-sync-tests`
  # so the ci-success `needs:` wiring is stable.
  lockfile-sync-tests:
    name: CI Self-Defense Tests
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.needs-ci == 'true' || needs.ci-gate.outputs.needs-agentic == 'true' || needs.ci-gate.outputs.needs-onboarding == 'true' || needs.ci-gate.outputs.needs-codex == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version

      - name: Shellcheck the gate scripts and their suites
        run: |
          shellcheck \
            scripts/check-lockfile-sync.sh scripts/__tests__/check-lockfile-sync.test.sh \
            scripts/check-ci-success.sh scripts/__tests__/check-ci-success.test.sh \
            scripts/check-agentic-sync.sh scripts/__tests__/check-agentic-sync.test.sh \
            scripts/check-taskboard-onboarding-hygiene.sh scripts/__tests__/check-taskboard-onboarding-hygiene.test.sh \
            scripts/check-codex-config-safety.sh scripts/__tests__/check-codex-config-safety.test.sh \
            scripts/check-ghaw-lock-sync.sh scripts/get-ghaw-compiler-version.sh scripts/__tests__/check-ghaw-lock-sync.test.sh \
            scripts/check-vitest-exit.sh scripts/__tests__/check-vitest-exit.test.sh \
            scripts/check-npm-audit.sh scripts/__tests__/check-npm-audit.test.sh \
            scripts/check-openapi-route-sync.sh scripts/__tests__/check-openapi-route-sync.test.sh \
            scripts/check-changeset-packages.sh scripts/__tests__/check-changeset-packages.test.sh \
            scripts/check-actions-pinned.sh scripts/__tests__/check-actions-pinned.test.sh \
            .claude/tools/dx-audit.sh .claude/tools/__tests__/dx-audit.test.sh

      - name: Run lockfile gate test suite
        run: bash scripts/__tests__/check-lockfile-sync.test.sh

      - name: Run ci-success verifier test suite
        run: bash scripts/__tests__/check-ci-success.test.sh

      - name: Run agentic-config gate test suite
        run: bash scripts/__tests__/check-agentic-sync.test.sh

      - name: Run taskboard onboarding-hygiene gate test suite
        run: bash scripts/__tests__/check-taskboard-onboarding-hygiene.test.sh

      - name: Run Codex config-safety gate test suite
        run: bash scripts/__tests__/check-codex-config-safety.test.sh

      - name: Run gh-aw lock-sync gate test suite
        run: bash scripts/__tests__/check-ghaw-lock-sync.test.sh

      - name: Run vitest exit-gate test suite
        run: bash scripts/__tests__/check-vitest-exit.test.sh

      - name: Run npm-audit allowlist gate test suite
        run: bash scripts/__tests__/check-npm-audit.test.sh

      - name: Run cross-provider DX-audit contract test
        run: bash .claude/tools/__tests__/dx-audit.test.sh

      - name: Run OpenAPI route-sync gate test suite
        run: bash scripts/__tests__/check-openapi-route-sync.test.sh

      - name: Run changeset-packages gate test suite
        run: bash scripts/__tests__/check-changeset-packages.test.sh

      - name: Run actions-pinned gate test suite
        run: bash scripts/__tests__/check-actions-pinned.test.sh

  # ---- Preview Deployment (PR only) ----
  # Deploys a Vercel preview for every PR so reviewers can test changes without
  # a local build. Only runs when VERCEL_DEPLOY_ENABLED is set and web/mcp files changed.
  preview-deploy:
    name: Preview Deployment
    needs: [ci-gate, quality-gates]
    # Skip for Dependabot PRs — repo secrets (VERCEL_TOKEN, VERCEL_TEAM_ID,
    # VERCEL_STAGING_PROJECT_ID) are not exposed to Dependabot-triggered runs,
    # so `vercel pull` fails with "No existing credentials found". Maintainers
    # who need a preview for a dep bump can rebase the branch onto a
    # maintainer branch or deploy manually via `vercel deploy`.
    if: |
      github.actor != 'dependabot[bot]' &&
      vars.VERCEL_DEPLOY_ENABLED == 'true' &&
      needs.quality-gates.result == 'success' &&
      (needs.ci-gate.outputs.needs-web == 'true' || needs.ci-gate.outputs.needs-mcp == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Vercel CLI
        run: npm i -g vercel@50.34.3

      - name: Install dependencies
        run: npm ci

      - name: Build @spawnforge/ui
        run: cd packages/ui && npm run build

      - name: Pull Vercel environment (preview)
        working-directory: web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Deploy directly instead of build+deploy-prebuilt.
          # vercel build uses child_process.spawn('npm') which fails on GHA
          # runners because setup-node's PATH isn't inherited by spawned
          # processes. vercel deploy builds remotely on Vercel infrastructure
          # where npm is always available.
          url=$(vercel deploy --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview deployment: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          COMMIT_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          short_sha="${COMMIT_SHA:0:8}"
          gh pr comment "$PR_NUMBER" \
            --body "**Preview deployment ready** — [\`${short_sha}\`](${DEPLOY_URL}): ${DEPLOY_URL}" \
            --repo "$REPO"

      - name: Verify preview is reachable
        if: steps.deploy.outputs.url
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          # Preview deployments sit behind Vercel Deployment Protection (#7994):
          # an unauthenticated request is answered by the SSO gate with HTTP 401
          # (server: Vercel, _vercel_sso_nonce cookie). That 401 PROVES the
          # deployment is live and serving — it is not an outage. A plain
          # `curl -sf` fails on any 4xx (exit 56), so it emitted false
          # "Preview URL not reachable" warnings on every protected preview.
          # Inspect the status code instead: only a missing response (000) or a
          # 5xx means the preview is genuinely unreachable.
          code=$(curl -s -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 5 --max-time 30 "$PREVIEW_URL" || true)
          echo "Preview responded with HTTP $code"
          case "$code" in
            000|5??)
              echo "::warning::Preview URL not reachable (HTTP $code)"
              ;;
            401|403)
              echo "Preview is reachable — HTTP $code is the expected Vercel Deployment Protection (SSO) gate."
              ;;
            *)
              echo "Preview is reachable (HTTP $code)."
              ;;
          esac

  # Engine-dependent E2E tests (@engine) require WASM + GPU which CI runners lack.
  # Only UI-only E2E tests (@ui) run in CI — they test React shell without WASM.
  # Sharded across 3 parallel runners to stay well under the 30-min timeout.
  test-e2e-ui:
    name: E2E UI Tests (${{ matrix.shard }})
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.needs-web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Build @spawnforge/ui
        run: cd packages/ui && npm run build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/ms-playwright
          # Key on the REAL root lockfile. This is a single-root-lockfile
          # monorepo: web/package-lock.json does not exist, so the old key
          # hashFiles('web/package-lock.json') returned '' — a constant
          # `playwright-` key that never invalidated, leaving stale browser
          # caches that intermittently failed with "Executable doesn't exist"
          # when Playwright's required browser revision changed. (#8589)
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium

      - name: Build for E2E
        working-directory: web
        env:
          SKIP_ENV_VALIDATION: 'true'
        run: npx next build

      - name: Run UI-only E2E tests (shard ${{ matrix.shard }})
        working-directory: web
        env:
          SKIP_ENV_VALIDATION: 'true'
        # @journey is excluded here defensively: those specs demand the exposed
        # store surface (NEXT_PUBLIC_E2E_HOOKS) + E2E_STRICT_STORES, neither of
        # which this store-less @ui build sets. They run only in test-e2e-journey.
        run: npx playwright test --grep '@ui' --grep-invert '@dev|@journey' --project=chromium --config playwright.ci.config.ts --shard=${{ matrix.shard }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: blob-report-${{ strategy.job-index }}
          path: web/blob-report/
          retention-days: 7

  # Strict interactive-journey gate (#8601 F09 + #8604 F12). Proves the core
  # new-user journey — idea -> generated scene -> entities spawn -> Play ->
  # winnable -> export — survives on the SAME production server users hit
  # (`next build` + `next start`). Unlike test-e2e-ui (@ui, store-less, guarded
  # assertions), this job:
  #   - builds with NEXT_PUBLIC_E2E_HOOKS=true so the editor/chat stores are
  #     exposed on `window` (build-time inline only; a normal deploy never sets
  #     the flag — see e2eHooksEnabled / cd.yml), and
  #   - runs with E2E_STRICT_STORES=true so the store-injection helpers THROW
  #     instead of skipping — a broken journey stage turns the gate RED rather
  #     than silently passing.
  # Required via the ci-success needs[] aggregate below.
  test-e2e-journey:
    name: E2E Journey Gate
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.needs-web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Build @spawnforge/ui
        run: cd packages/ui && npm run build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/ms-playwright
          # Same single-root-lockfile key as test-e2e-ui (#8589).
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium

      # NEXT_PUBLIC_E2E_HOOKS is build-time only (Next.js inlines NEXT_PUBLIC_*
      # at build). It exposes the editor/chat stores on window so the strict
      # journey specs can drive a representative generated game without WASM/AI.
      # cd.yml never sets this flag, so prod/staging/preview deploys never expose
      # stores — this is a CI-only build.
      - name: Build for journey E2E (stores exposed)
        working-directory: web
        env:
          SKIP_ENV_VALIDATION: 'true'
          NEXT_PUBLIC_E2E_HOOKS: 'true'
        run: npx next build

      - name: Run strict interactive-journey gate
        working-directory: web
        env:
          SKIP_ENV_VALIDATION: 'true'
          E2E_STRICT_STORES: 'true'
        run: npx playwright test --config playwright.journey.config.ts

      - name: Upload journey report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-journey-report
          path: web/playwright-report/
          retention-days: 14

  # Engine smoke gate (#8602 F10). The FIRST per-PR job that actually boots the
  # WASM engine: it builds ONLY the WebGL2 variant, serves it same-origin, and
  # runs a curated `@engine-smoke` journey (load -> spawn -> inspect -> play ->
  # stop -> export) under ANGLE/SwiftShader software WebGL2 — NOT `--disable-gpu`,
  # which leaves wgpu with no GL context and hangs `init_engine` (the exact reason
  # every other CI Playwright config can only run store-less @ui/@journey specs).
  #
  # Before this gate, NO PR workflow ran @engine at all (the substantive editor
  # journeys only ran post-merge, and even cd.yml inverts @engine out). It is
  # gated on needs-web OR needs-engine: an engine-only PR (rendering/ECS changes)
  # used to run ZERO e2e — the precise regression class F10 calls out.
  #
  # DOCUMENTED GAP: SwiftShader is SOFTWARE WebGL2. This validates ECS / picking /
  # play / export journeys but NOT the WebGPU code path or real-GPU rendering
  # correctness (e.g. the pink-material / tonemapping_luts class of bugs). Those
  # remain a known per-PR gap requiring a GPU-capable / nightly runner — see
  # docs/audits/2026-05-30-security-testing-audit.md (F10).
  #
  # Required via the ci-success needs[] aggregate below (and protected from a
  # silent `if: false` skip by the anti-tamper map in scripts/check-ci-success.sh,
  # mapped to BOTH needs-web and needs-engine — the two arms of this job's `if:`).
  test-e2e-engine-smoke:
    name: E2E Engine Smoke Gate
    needs: [ci-gate]
    if: ${{ needs.ci-gate.outputs.needs-web == 'true' || needs.ci-gate.outputs.needs-engine == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Build @spawnforge/ui
        run: cd packages/ui && npm run build

      # --- WASM (WebGL2 only) -------------------------------------------------
      # SwiftShader cannot drive WebGPU, so we build ONLY the webgl2 variant —
      # not the 4 variants cd.yml/quality-gates.yml produce — to keep the cargo
      # cost to one binary. wasm-bindgen MUST be 0.2.108 (pinned per CLAUDE.md),
      # exactly as quality-gates.yml / cd.yml install it.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: engine -> target

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.108

      - name: Build WebGL2 WASM + wasm-bindgen
        working-directory: engine
        run: |
          cargo build --target wasm32-unknown-unknown --release --features webgl2
          wasm-bindgen --target web --out-dir pkg-webgl2 target/wasm32-unknown-unknown/release/forge_engine.wasm

      - name: Copy WASM into web/public (same-origin)
        run: |
          mkdir -p web/public/engine-pkg-webgl2
          cp engine/pkg-webgl2/* web/public/engine-pkg-webgl2/

      # --- Playwright ---------------------------------------------------------
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ~/.cache/ms-playwright
          # Same single-root-lockfile key as test-e2e-ui (#8589).
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium

      - name: Build for engine-smoke E2E
        working-directory: web
        env:
          SKIP_ENV_VALIDATION: 'true'
          # The @engine-smoke fixture loads /dev, which renders the editor ONLY
          # when e2eHooksEnabled() is true. NEXT_PUBLIC_E2E_HOOKS is build-time
          # inlined (Next.js), so a production `next build` without it leaves the
          # flag off: /dev then redirects to /sign-in, whose <SignIn> calls
          # useSession with no <ClerkProvider> in this Clerk-less CI env, throws,
          # and the engine never boots (__FORGE_ENGINE_READY times out). Mirror
          # the strict @ui journey gate and build with the flag so /dev renders.
          NEXT_PUBLIC_E2E_HOOKS: 'true'
        run: npx next build

      # Runs ONLY the curated @engine-smoke spec, under SwiftShader software
      # WebGL2 (launch flags live in playwright.engine.config.ts). The fixture
      # forces the webgl2 backend so loadWasm never probes WebGPU.
      - name: Run engine smoke gate
        working-directory: web
        env:
          SKIP_ENV_VALIDATION: 'true'
        run: npx playwright test --config playwright.engine.config.ts

      - name: Upload engine-smoke report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-engine-smoke-report
          path: web/playwright-report/
          retention-days: 14

  # Merge sharded E2E reports into a single HTML report
  merge-e2e-reports:
    name: Merge E2E Reports
    needs: [test-e2e-ui]
    if: ${{ !cancelled() && needs.test-e2e-ui.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Download blob reports
        # Must match the upload-artifact major version used for blob-report-*
        # above (@v4) — mixing artifact action majors is a documented gotcha.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: web/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge reports
        working-directory: web
        run: npx playwright merge-reports --reporter=html ./all-blob-reports

      - name: Upload merged report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-report
          path: web/playwright-report/
          retention-days: 14

  # ---- CI Success (aggregating required check) ----
  # Audit 2026-05-30 (F01): branch protection previously required ONLY ci-gate,
  # a no-op path detector that always passes — so a PR could merge with failing
  # eslint/tsc/vitest/coverage/build because those jobs were conditionally
  # skipped and not individually required. This job depends on every REAL gate
  # and fails if any of them failed or was cancelled. A path-gated job that is
  # legitimately skipped is allowed (result 'skipped' is not a failure).
  #
  # ACTION REQUIRED (user, one-time): make THIS job ("CI Success") the required
  # status check in the `main` branch-protection ruleset, replacing/​alongside
  # "CI Gate". Code cannot change branch-protection settings.
  #
  # preview-deploy (deployment, vars-gated) and merge-e2e-reports (reporting
  # only) are intentionally excluded — neither gates correctness.
  ci-success:
    name: CI Success
    if: ${{ always() }}
    needs:
      - ci-gate
      - quality-gates
      - command-parity
      - build-nextjs
      - docs-internal-gate
      - design-internal-gate
      - hook-tests
      - skills-lint
      - lockfile-sync
      - lockfile-sync-tests
      - agentic-sync
      - taskboard-onboarding-guard
      - codex-config-guard
      - ghaw-lock-sync
      - openapi-route-sync
      - actions-pin-check
      - test-e2e-ui
      - test-e2e-journey
      - test-e2e-engine-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The verify logic lives in scripts/check-ci-success.sh (unit-tested by the
      # lockfile-sync-tests job) so it can be exercised hermetically and so the
      # anti-tamper check — a self-defending gate must not be `skipped` while its
      # trigger fired — can't be silently reverted to a skip-tolerant inline jq.
      - name: Verify all required gates passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: bash scripts/check-ci-success.sh
