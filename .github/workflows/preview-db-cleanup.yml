name: Preview DB Cleanup

# Delete the Neon branch backing a PR's preview once the PR closes (#9972), and
# sweep on a schedule for whatever the close event missed (#10015).
#
# The allowance is 10 branches per project and branch compute counts against
# the project's CU-hour budget, so cleanup is a cost control, not just hygiene.
# Without it the allowance is exhausted and the NEXT preview fails to get a
# database — which looks like a broken pipeline rather than a full quota.
#
# `pull_request: closed` fires on merge and on close-without-merge alike, which
# is what we want: both end the preview. It is the fast path, and it can miss:
# a cancelled run, a secret outage, a close that raced the preview job's own
# create. The schedule is the slow path that catches what the fast path
# dropped. It also prunes the dry-run leftovers and expired snapshots cd.yml
# can only prune on its next schema deploy. Six-hourly keeps a missed close
# from holding a slot for more than a quarter of a day; on a ten-branch
# allowance that slot is one of roughly six a preview can use.

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '23 */6 * * *'
  # Force the sweep by hand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed per PR so two rapid close/reopen cycles cannot race on the same branch.
  group: preview-db-cleanup-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete the preview Neon branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    # Dependabot-triggered runs cannot read repo secrets, and the preview job
    # skips for the same reason — so there is no branch to delete.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Delete this PR's branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # The same fixed-width name ci.yml creates, from the same code. The
          # padding is what makes prune's `startswith` match safe: without it
          # "preview-pr-1" would also match "preview-pr-12" and this cleanup
          # would delete the branches of every PR whose number starts with 1.
          name="$(bash scripts/preview-db-branch.sh name "$PR_NUMBER")"
          echo "Pruning Neon branch: ${name}"
          bash scripts/neon-branch.sh prune "$name" 0

      - name: Sweep abandoned preview branches
        # Use the same state-aware policy as scheduled cleanup. An old branch
        # can still back an open PR; age alone does not make it abandoned.
        continue-on-error: true
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/preview-db-branch.sh sweep

  sweep:
    name: Sweep closed-PR previews, dry-run leftovers and expired snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sweep
        # PR state comes from GitHub through `gh` (GH_TOKEN, read-only); a
        # lookup that fails keeps the branch. Policy and exit codes:
        # scripts/preview-db-branch.sh.
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/preview-db-branch.sh sweep
