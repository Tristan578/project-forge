name: Preview DB Cleanup

# Delete the Neon branch backing a PR's preview once the PR closes (#9972).
#
# The free allowance is 10 branches per project and branch compute counts
# against the project's CU-hour budget, so cleanup is a cost control, not just
# hygiene. Without it the allowance is exhausted by branches of long-merged PRs
# and the NEXT preview fails to get a database — which would look like a broken
# pipeline rather than a full quota.
#
# `pull_request: closed` fires on merge and on close-without-merge alike, which
# is what we want: both end the preview.

on:
  pull_request:
    types: [closed]
  # Sweep leftovers by hand when a run was cancelled before its cleanup, or
  # when the retention sweep below needs forcing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed per PR so two rapid close/reopen cycles cannot race on the same branch.
  group: preview-db-cleanup-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete the preview Neon branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Dependabot-triggered runs cannot read repo secrets, and the preview job
    # skips for the same reason — so there is no branch to delete.
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Delete this PR's branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ -z "${PR_NUMBER:-}" ]; then
            echo "No PR number (manual dispatch); skipping the per-PR delete."
            exit 0
          fi

          # Same zero-padded shape ci.yml creates. The padding is what makes
          # prune's `startswith` match safe: without it "preview-pr-1" would also
          # match "preview-pr-12" and this cleanup would delete the branches of
          # every PR whose number starts with 1.
          name="preview-pr-$(printf '%06d' "$PR_NUMBER")"
          echo "Pruning Neon branch: ${name}"
          bash scripts/neon-branch.sh prune "$name" 0

      - name: Sweep abandoned preview branches
        # Safety net for the case the per-PR delete never ran — a cancelled
        # workflow, a force-pushed close, a secret outage. Seven days is well
        # past any live PR's preview while still bounding the allowance.
        #
        # `continue-on-error` because housekeeping must never turn a merged PR's
        # workflow red; the per-PR delete above is the real cleanup and it fails
        # loudly.
        continue-on-error: true
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: bash scripts/neon-branch.sh prune 'preview-pr-' 7
