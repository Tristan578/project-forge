name: Changeset Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changeset:
    name: Require Changeset
    runs-on: ubuntu-latest
    steps:
      - name: Skip for label, Version Packages, or non-npm Dependabot PR
        id: skip
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          ACTOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # Bypass for "skip changeset" label
          if echo "$LABELS" | grep -q '"skip changeset"'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Changeset check bypassed via 'skip changeset' label."
            exit 0
          fi
          # Bypass for Version Packages PR (created by changesets/action,
          # which removes consumed .changeset/*.md files — no new ones expected)
          if [[ "$PR_TITLE" == "chore: version packages"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Changeset check bypassed — Version Packages PR."
            exit 0
          fi
          # Bypass for Dependabot PRs in ecosystems that are NOT npm-versioned:
          # cargo crates (compiled into the WASM engine) and pinned GitHub
          # Actions. A changeset is structurally inapplicable to these —
          # .changeset/config.json only version-manages the npm workspace
          # packages (web, @spawnforge/ui, mcp-server, root). npm bumps
          # (dependabot/npm_and_yarn/*) are deliberately NOT matched, so a
          # user-facing web / @spawnforge/ui / mcp-server runtime bump still
          # needs a changeset or the explicit 'skip changeset' label. Uses the
          # same actor-gating idiom as pr-workitem-check.yml's Dependabot
          # exemption, but narrower in scope: that job skips ALL Dependabot PRs
          # (actor-only), whereas this skips only the non-npm ecosystems (by
          # branch prefix), so npm bumps still reach the gate.
          if [[ "$ACTOR" == "dependabot[bot]" ]] && \
             [[ "$HEAD_REF" == dependabot/cargo/* || "$HEAD_REF" == dependabot/github_actions/* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Changeset check bypassed — Dependabot non-npm ecosystem (cargo/github-actions); no npm package to version."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        if: steps.skip.outputs.skip == 'false'
        with:
          fetch-depth: 0

      - name: Check for changeset files
        if: steps.skip.outputs.skip == 'false'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Use base SHA (reliable) instead of origin/<ref> which may not exist as a remote-tracking ref
          CHANGESETS=$(git diff --name-only --diff-filter=A "${BASE_SHA}...HEAD" -- '.changeset/*.md' | grep -v 'README.md' || true)

          if [ -z "$CHANGESETS" ]; then
            echo "::error::No changeset found. Run 'npx changeset' to add one, or add the 'skip changeset' label to bypass."
            echo ""
            echo "Every PR that changes user-facing behavior needs a changeset."
            echo "Create one with: npx changeset (from the repo root)"
            echo "Or manually create .changeset/<name>.md with:"
            echo ""
            echo '---'
            echo '"web": patch'
            echo '---'
            echo ''
            echo 'Description of the change.'
            exit 1
          fi

          echo "Found changeset(s):"
          echo "$CHANGESETS"

      - name: Validate changeset package names against the workspace
        if: steps.skip.outputs.skip == 'false'
        # Guards against a changeset targeting a non-workspace package (e.g. the
        # root "spawnforge", or typos like "spawnforge-web"/"@spawnforge/web"),
        # which makes `changeset version` throw during release assembly. The
        # require-a-changeset step above only checks a file EXISTS — it never
        # validated the package name, which is how malformed names kept landing
        # (#8325 → #8396 → #8732). node is preinstalled on the runner.
        run: bash scripts/check-changeset-packages.sh
