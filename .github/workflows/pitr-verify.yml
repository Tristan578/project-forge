name: PITR Verification

on:
  schedule:
    # 08:00 UTC on the 1st of each month
    - cron: '0 8 1 * *'
  workflow_dispatch:
    inputs:
      hours_ago:
        description: 'How far back to recover from (hours)'
        required: false
        default: '24'

permissions:
  contents: read
  issues: write

jobs:
  verify:
    name: Verify Neon PITR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
      HOURS_AGO: ${{ github.event.inputs.hours_ago || '24' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install psql
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run unit tests for driver
        run: node --test scripts/pitr-verify.test.mjs scripts/pitr-report-failure.test.mjs

      - name: Run PITR verification
        id: verify
        run: node scripts/pitr-verify.mjs

      - name: Summary
        if: always()
        env:
          OUTCOME: ${{ steps.verify.outcome }}
          FAILURE_CLASS: ${{ steps.verify.outputs.failure_class }}
          RUN_ID: ${{ github.run_id }}
        run: |
          {
            echo "# PITR Verification"
            echo ""
            echo "- Result: **${OUTCOME}**"
            echo "- Recovered from: ${HOURS_AGO}h ago"
            echo "- Run: ${RUN_ID}"
            if [ -n "${FAILURE_CLASS}" ]; then
              echo "- Failure class: **${FAILURE_CLASS}**"
              case "${FAILURE_CLASS}" in
                config)
                  echo ""
                  echo "The backup was never exercised: NEON_API_KEY / NEON_PROJECT_ID"
                  echo "is missing or wrong. This is NOT evidence of data loss."
                  ;;
                pitr)
                  echo ""
                  echo "The recovery branch could not be restored or verified."
                  echo "Treat this as a real backup failure."
                  ;;
              esac
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Reports to a per-class issue and comments on repeats instead of minting a
      # new issue every month. A configuration fault must never be filed as a
      # data-recovery event, so the class decides title, labels and runbook link.
      - name: Report failure
        if: failure() && github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PITR_FAILURE_CLASS: ${{ steps.verify.outputs.failure_class }}
        run: node scripts/pitr-report-failure.mjs
