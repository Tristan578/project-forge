name: CD

# Security: Preview URL deployment protection (#7994)
#
# Preview deployments created by this workflow are publicly accessible by
# default. To prevent unauthenticated access to preview URLs (which may
# expose unreleased features or BYOK key flows):
#
#   1. Go to Vercel Dashboard -> spawnforge project -> Settings -> Deployment Protection
#   2. Set "Vercel Authentication" (or "Password Protection") to "All Deployments"
#      so that every preview URL requires SSO / Vercel login before rendering.
#   3. Repeat for spawnforge-staging, spawnforge-docs, and spawnforge-design projects.
#
# This CANNOT be configured via vercel.json or CLI flags -- it must be set in
# the Vercel Dashboard (project settings) or via the REST API:
#   PATCH /v9/projects/{id}?teamId={teamId}
#   Body: { "ssoProtection": { "deploymentType": "preview" } }
#
# Reference: https://vercel.com/docs/security/deployment-protection

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote_to_production:
        description: 'Promote staging to production'
        required: false
        type: boolean
        default: false
      rollback_production:
        description: 'Rollback production to a previous deployment URL (leave blank to skip)'
        required: false
        type: string
        default: ''
      allow_destructive_migration:
        description: 'Approve a destructive production schema change (DROP TABLE/COLUMN, type change). Leave off unless you have read the diff.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --cfg=web_sys_unstable_apis

jobs:
  # ---- Manual Rollback (workflow_dispatch only, bypasses quality gates) ----
  # Trigger via: gh workflow run cd.yml -f rollback_production=https://prev-deploy.vercel.app
  rollback-production-manual:
    name: Rollback Production (Manual)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event.inputs.rollback_production != '' && github.event.inputs.rollback_production != null }}
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
    steps:
      # checkout is required so setup-node can read .node-version from the workspace
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install Vercel CLI
        run: npm i -g vercel@50.34.3

      - name: Promote previous deployment to production
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ROLLBACK_URL: ${{ github.event.inputs.rollback_production }}
        run: |
          echo "Rolling back production to: $ROLLBACK_URL"
          vercel promote "$ROLLBACK_URL" --scope "$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
          echo "Rollback complete. Production now at: $ROLLBACK_URL"

      - name: Notify Slack of manual rollback
        if: ${{ vars.SLACK_WEBHOOK_INCIDENTS != '' }}
        env:
          SLACK_WEBHOOK: ${{ vars.SLACK_WEBHOOK_INCIDENTS }}
          ROLLBACK_URL: ${{ github.event.inputs.rollback_production }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        run: |
          payload=$(printf '{"text":"*SpawnForge Production Rollback (Manual)*\n*Triggered by:* %s\n*Promoted URL:* <%s|%s>\n*Workflow run:* <%s|View run>"}' \
            "$ACTOR" "$ROLLBACK_URL" "$ROLLBACK_URL" "$RUN_URL")
          curl --silent --fail -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$payload" || echo "Slack notification failed (non-fatal)"

  # ---- Quality Gates (must all pass before any deployment) ----

  # Quality gate jobs run on every trigger (push to main and workflow_dispatch).
  # This ensures merges that bypass branch protection are still validated before deploy.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Build @spawnforge/ui
        run: cd packages/ui && npm run build

      - run: npx eslint --max-warnings 0
        working-directory: web

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Build @spawnforge/ui
        run: cd packages/ui && npm run build

      - run: npx tsc --noEmit
        working-directory: web

  test-web:
    name: Web Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Build @spawnforge/ui
        run: cd packages/ui && npm run build

      - name: Run tests with coverage
        working-directory: web
        # Runs --coverage against the standalone web/vitest.config.ts, mirroring
        # quality-gates.yml. This job is what re-validates a commit that reached
        # main without the PR gate (direct push, admin merge); without --coverage
        # that re-validation had a hole exactly the size of the coverage
        # thresholds. vitest.workspace.ts exists for local dev environment splits
        # but does not enforce root-level thresholds, which is why CI uses the
        # standalone config. Threshold values live in that config and are
        # auto-ratcheted by coverage-ratchet.yml — never hardcode them here.
        #
        # Timeout safety net: vitest hangs after test completion due to jsdom/
        # coverage open handles (known issue vitest#3077). A non-zero exit
        # (timeout 124, OOM 137, segfault 139, ...) is swallowed by the gate below
        # ONLY when the captured output shows a green test summary AND (because
        # this job now runs --coverage) the "Coverage report from" marker — proof
        # the tests completed and the coverage phase reached report generation. A
        # run killed mid-tests or before report generation began still fails.
        run: |
          set +e
          timeout 600 npx vitest run --coverage 2>&1 | tee /tmp/vitest-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          # Adjudicate the exit code via the single tested gate
          # (scripts/check-vitest-exit.sh, unit-tested by the CI Self-Defense
          # Tests job) — the same gate quality-gates.yml uses, so the two no
          # longer drift. It propagates real test failures AND coverage-threshold
          # failures (#8598 — a coverage miss has no "Test Files ... failed" line)
          # and swallows only the vitest#3077 open-handle / timeout false
          # positives. The --coverage flag must be passed to BOTH the vitest
          # invocation and the gate: it is what makes the gate additionally
          # require the "Coverage report from" marker before swallowing, so a
          # green test summary alone cannot stand in for adjudicated thresholds.
          # Invoked by repo-root path because this step runs with
          # working-directory: web.
          bash "$GITHUB_WORKSPACE/scripts/check-vitest-exit.sh" "$EXIT_CODE" /tmp/vitest-output.txt --coverage

  test-mcp:
    name: MCP Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npx vitest run
        working-directory: mcp-server

  check-changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      engine-changed: ${{ steps.filter.outputs.engine }}
      web-changed: ${{ steps.filter.outputs.web }}
      docs-changed: ${{ steps.filter.outputs.docs-changed }}
      design-changed: ${{ steps.filter.outputs.design-changed }}
      web-changed-files: ${{ steps.filter.outputs.web-changed-files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full clone required: fetch-depth: 2 caused silent git diff failures
          # on squash merges and rapid pushes where github.event.before was not
          # present in the shallow clone. Empty CHANGED output left both flags
          # false, causing every deploy to be skipped.
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          BEFORE="$BEFORE_SHA"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || true)

          # Fallback: empty diff (first push, force-push, or unreachable SHA)
          # Default web=true so the deploy pipeline is not silently skipped.
          if [ -z "$CHANGED" ]; then
            echo "::warning::git diff returned empty output -- defaulting web=true engine=false"
            echo "engine=false" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "docs-changed=false" >> "$GITHUB_OUTPUT"
            echo "design-changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if echo "$CHANGED" | grep -q '^engine/'; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
            echo "Engine files changed -- WASM build required"
          else
            echo "engine=false" >> "$GITHUB_OUTPUT"
            echo "No engine changes -- skipping WASM build"
          fi

          if echo "$CHANGED" | grep -qE '^web/|^package\.json|^\.github/'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "Web files changed -- deploy required"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
            echo "No web changes -- skipping deploy"
          fi

          echo "$CHANGED" | grep -qE '^apps/docs/|^mcp-server/manifest/' && echo "docs-changed=true" >> "$GITHUB_OUTPUT" || echo "docs-changed=false" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" | grep -qE '^apps/design/|^packages/ui/' && echo "design-changed=true" >> "$GITHUB_OUTPUT" || echo "design-changed=false" >> "$GITHUB_OUTPUT"

          # Expose changed web file list for schema-change gating
          WEB_FILES=$(echo "$CHANGED" | grep '^web/' || true)
          echo "web-changed-files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$WEB_FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  check-deployment-drift:
    name: Detect Deployment Drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ vars.VERCEL_DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read
    outputs:
      docs-changed: ${{ steps.docs.outputs.changed }}
      design-changed: ${{ steps.design.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check docs deployment drift
        id: docs
        env:
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          bash scripts/check-vercel-deployment-drift.sh
          '${{ secrets.VERCEL_DOCS_PROJECT_ID }}'
          '^(apps/docs/|mcp-server/manifest/|packages/ui/|package(-lock)?\.json$|\.node-version$|\.github/workflows/cd\.yml$)'
          docs

      - name: Check design deployment drift
        id: design
        env:
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: >-
          bash scripts/check-vercel-deployment-drift.sh
          '${{ secrets.VERCEL_DESIGN_PROJECT_ID }}'
          '^(apps/design/|packages/ui/|package(-lock)?\.json$|\.node-version$|\.github/workflows/cd\.yml$)'
          design

  build-wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [check-changes]
    if: ${{ needs.check-changes.outputs.engine-changed == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: engine -> target

      - name: Try downloading WASM from CI (same SHA)
        id: ci-wasm
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wasm-binaries
          path: engine/
        continue-on-error: true

      - name: Install wasm-bindgen-cli
        if: steps.ci-wasm.outcome != 'success'
        run: cargo install wasm-bindgen-cli --version 0.2.127

      - name: Build WebGL2
        if: steps.ci-wasm.outcome != 'success'
        working-directory: engine
        run: cargo build --target wasm32-unknown-unknown --release --features webgl2

      - name: Build WebGPU
        if: steps.ci-wasm.outcome != 'success'
        working-directory: engine
        run: cargo build --target wasm32-unknown-unknown --release --features webgpu

      - name: Run wasm-bindgen (WebGL2)
        if: steps.ci-wasm.outcome != 'success'
        working-directory: engine
        run: wasm-bindgen --target web --out-dir pkg-webgl2 target/wasm32-unknown-unknown/release/forge_engine.wasm

      - name: Run wasm-bindgen (WebGPU)
        if: steps.ci-wasm.outcome != 'success'
        working-directory: engine
        run: wasm-bindgen --target web --out-dir pkg-webgpu target/wasm32-unknown-unknown/release/forge_engine.wasm

      - name: Build WebGL2 Runtime (stripped editor)
        if: steps.ci-wasm.outcome != 'success'
        working-directory: engine
        run: cargo build --target wasm32-unknown-unknown --release --features webgl2,runtime

      - name: Run wasm-bindgen (WebGL2 Runtime)
        if: steps.ci-wasm.outcome != 'success'
        working-directory: engine
        run: wasm-bindgen --target web --out-dir pkg-webgl2-runtime target/wasm32-unknown-unknown/release/forge_engine.wasm

      - name: Build WebGPU Runtime (stripped editor)
        if: steps.ci-wasm.outcome != 'success'
        working-directory: engine
        run: cargo build --target wasm32-unknown-unknown --release --features webgpu,runtime

      - name: Run wasm-bindgen (WebGPU Runtime)
        if: steps.ci-wasm.outcome != 'success'
        working-directory: engine
        run: wasm-bindgen --target web --out-dir pkg-webgpu-runtime target/wasm32-unknown-unknown/release/forge_engine.wasm

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasm-binaries
          path: |
            engine/pkg-webgl2/
            engine/pkg-webgpu/
            engine/pkg-webgl2-runtime/
            engine/pkg-webgpu-runtime/
          retention-days: 7

  e2e:
    name: E2E (UI ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: [build-wasm]
    # `!cancelled()` is load-bearing. An `if:` with no status-check function
    # gets an implicit `success()` prepended, and success() is FALSE when a
    # needed job was skipped -- so the `result == 'skipped'` clause below was
    # dead for this job's whole life: build-wasm is skipped on every web-only
    # push, this gate was skipped with it, and the deploy jobs (which accept
    # needs.e2e.result == 'skipped') shipped the web with zero E2E coverage.
    # On engine pushes it DID run -- against the default next-dev config, all
    # 505 specs, 2 workers, 15-minute budget -- and was cancelled by its own
    # timeout on every run, which cancelled the deploy with it (PF-1230 / #9364).
    # This job now mirrors ci.yml's test-e2e-ui (next build + next start via
    # playwright.ci.config.ts, @ui only, 3 shards, ~2.5 min each).
    if: ${{ !cancelled() && (needs.build-wasm.result == 'success' || needs.build-wasm.result == 'skipped') }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # npm can drop the platform-native @next/swc optional dep while exiting 0
      # (npm/cli#4828 class) -- fail loudly here, not as an opaque next-build
      # error two steps later (PF-947). Same guard as ci.yml's next-build jobs.
      - name: Assert native swc binding survived npm ci
        run: bash scripts/check-native-bindings.sh

      - name: Build @spawnforge/ui
        run: cd packages/ui && npm run build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: web
        run: npx playwright install-deps chromium

      # The @ui specs do not load the engine, so a missing WASM artifact must
      # not fail the gate on a web-only push -- but when build-wasm DID run,
      # serve its output so the app under test matches what deploys.
      - name: Download WASM artifacts
        if: needs.build-wasm.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wasm-binaries
          path: engine/

      - name: Copy WASM to web/public
        if: needs.build-wasm.result == 'success'
        run: |
          mkdir -p web/public/engine-pkg-webgl2
          mkdir -p web/public/engine-pkg-webgpu
          mkdir -p web/public/engine-pkg-webgl2-runtime
          mkdir -p web/public/engine-pkg-webgpu-runtime
          cp engine/pkg-webgl2/* web/public/engine-pkg-webgl2/
          cp engine/pkg-webgpu/* web/public/engine-pkg-webgpu/
          cp engine/pkg-webgl2-runtime/* web/public/engine-pkg-webgl2-runtime/ 2>/dev/null || true
          cp engine/pkg-webgpu-runtime/* web/public/engine-pkg-webgpu-runtime/ 2>/dev/null || true

      - name: Build for E2E
        working-directory: web
        env:
          SKIP_ENV_VALIDATION: 'true'
        run: npx next build

      - name: Run UI-only E2E tests (shard ${{ matrix.shard }})
        working-directory: web
        env:
          SKIP_ENV_VALIDATION: 'true'
        # Same selection as ci.yml test-e2e-ui: @journey needs the exposed
        # store surface (NEXT_PUBLIC_E2E_HOOKS + E2E_STRICT_STORES) this
        # store-less build does not set, and @engine needs WASM + GPU.
        run: npx playwright test --grep '@ui' --grep-invert '@dev|@journey' --project=chromium --config playwright.ci.config.ts --shard=${{ matrix.shard }}

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: web/playwright-report/
          retention-days: 14

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-results-${{ strategy.job-index }}
          path: web/test-results/
          retention-days: 14

  security:
    name: Rust Security Audit
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # Hardened npm-audit gate (same as quality-gates.yml). A raw
      # `npm audit --audit-level=high` cannot pass here: the tree recurrently
      # carries a transitive, dev-only advisory that npm `overrides` provably
      # cannot relock away (see ALLOWED_ADVISORIES in scripts/check-npm-audit.sh
      # for the current occupant + justification). The gate waives ONLY
      # documented, dev-only, non-exploitable advisories by id — each pinned to
      # its expected node_modules location — and stays HARD for every other
      # high/critical advisory. Unit-tested by the CI Self-Defense Tests job.
      - name: npm audit (web) — allowlist gate
        run: bash scripts/check-npm-audit.sh web

      # Install mcp-server's workspace deps before auditing it, mirroring
      # quality-gates.yml. The root `npm ci` above already installs every
      # workspace, but this keeps the two security jobs byte-for-byte identical
      # so the (main-only) cd.yml audit can never diverge from the PR-exercised
      # quality-gates path.
      - run: npm ci
        working-directory: mcp-server

      - name: npm audit (mcp-server) — allowlist gate
        run: bash scripts/check-npm-audit.sh mcp-server

      # npm audit scopes advisories to the INVOKING workspace's dependency
      # subtree, so the two runs above never evaluate the ROOT workspace's own
      # devDeps — nor the packages/* and apps/* workspaces. Auditing from the
      # repo root covers the entire install graph (PF-1010 / #9029).
      - name: npm audit (root) — allowlist gate
        run: bash scripts/check-npm-audit.sh .

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: engine -> target

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: cargo audit (engine)
        working-directory: engine
        run: cargo audit

  # ---- WASM CDN Upload ----
  upload-wasm-cdn:
    name: Upload WASM to R2 CDN
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build-wasm]
    if: ${{ vars.R2_CDN_ENABLED == 'true' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install AWS CLI
        run: |
          curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update

      - name: Download WASM artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wasm-binaries
          path: engine/

      - name: Prepare WASM source directory
        run: |
          mkdir -p wasm-upload/engine-pkg-webgl2
          mkdir -p wasm-upload/engine-pkg-webgpu
          mkdir -p wasm-upload/engine-pkg-webgl2-runtime
          mkdir -p wasm-upload/engine-pkg-webgpu-runtime
          cp engine/pkg-webgl2/* wasm-upload/engine-pkg-webgl2/
          cp engine/pkg-webgpu/* wasm-upload/engine-pkg-webgpu/
          cp engine/pkg-webgl2-runtime/* wasm-upload/engine-pkg-webgl2-runtime/ 2>/dev/null || true
          cp engine/pkg-webgpu-runtime/* wasm-upload/engine-pkg-webgpu-runtime/ 2>/dev/null || true

      - name: Generate WASM manifests for CDN
        run: bash scripts/generate-wasm-manifests.sh wasm-upload

      - name: Upload to R2
        run: bash scripts/upload-wasm-to-r2.sh
        env:
          WASM_SOURCE_DIR: wasm-upload
          ENGINE_VERSION: ${{ github.sha }}
          R2_ACCOUNT_ID: ${{ secrets.ASSET_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.ASSET_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.ASSET_R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'spawnforge-engine' }}

  # ---- Stage 1: Deploy to Staging ----
  # Runs automatically after all quality gates pass on push to main.
  # Staging mirrors production config but receives new code first.
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # check-changes is intentionally NOT in needs -- path detection only gates
    # build-wasm (slow). Every push to main that passes quality gates must deploy.
    needs: [lint, typecheck, test-web, test-mcp, build-wasm, e2e, security, upload-wasm-cdn]
    if: |
      always() &&
      vars.VERCEL_DEPLOY_ENABLED == 'true' &&
      github.event.inputs.promote_to_production != 'true' &&
      needs.lint.result == 'success' &&
      needs.typecheck.result == 'success' &&
      needs.test-web.result == 'success' &&
      (needs.test-mcp.result == 'success' || needs.test-mcp.result == 'skipped') &&
      (needs.security.result == 'success' || needs.security.result == 'skipped') &&
      (needs.build-wasm.result == 'success' || needs.build-wasm.result == 'skipped') &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') &&
      (needs.upload-wasm-cdn.result == 'success' || needs.upload-wasm-cdn.result == 'skipped')
    permissions:
      contents: read
      deployments: write
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Vercel CLI
        run: npm i -g vercel@50.34.3

      # spawnforge-staging is a separate Vercel project, so its Production target
      # is the stable staging environment. A Preview target creates an ephemeral
      # URL and leaves spawnforge-staging.vercel.app pinned to an old deployment.
      # Run from repo root — Vercel rootDirectory=web handles the subdirectory.
      # Adding working-directory:web here causes web/web path doubling on remote builds.
      - name: Link Vercel project (staging)
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Download WASM artifacts for same-origin fallback
        id: download-wasm-staging
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wasm-binaries
          path: engine/
        continue-on-error: true

      - name: Populate same-origin WASM fallback
        if: steps.download-wasm-staging.outcome == 'success'
        run: |
          for variant in webgl2 webgpu webgl2-runtime webgpu-runtime; do
            src="engine/pkg-${variant}"
            dest="web/public/engine-pkg-${variant}"
            if [ -d "$src" ]; then
              mkdir -p "$dest"
              cp "$src"/* "$dest"/
            fi
          done
          bash scripts/generate-wasm-manifests.sh web/public

      - name: Deploy to staging (remote build)
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_STAGING_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ENGINE_VERSION: ${{ github.sha }}
        run: |
          url=$(vercel deploy --prod --token="$VERCEL_TOKEN" \
            --build-env NEXT_PUBLIC_ENGINE_VERSION="$ENGINE_VERSION")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to staging: $url"

      - name: Post-deploy health check (staging)
        id: health-check-staging
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          HEALTH_CHECK_STABILIZE_S: '10'
          HEALTH_CHECK_RETRIES: '3'
          HEALTH_CHECK_INTERVAL_S: '10'
          # SSO-protected deployments reject bypass tokens. Use vercel curl
          # which authenticates via VERCEL_TOKEN (already used for deploy).
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bash scripts/post-deploy-health-check.sh "$DEPLOY_URL"

  # ---- Stage 2: Deploy to Production ----
  # Auto-deploys after staging succeeds on push to main.
  # Also triggerable manually via workflow_dispatch with promote_to_production=true.
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # check-changes is required: its outputs.web-changed-files is consumed by the
    # schema migration step. Without this in needs, the expression resolves to
    # empty string and the migration is always skipped.
    needs: [lint, typecheck, test-web, test-mcp, build-wasm, e2e, security, upload-wasm-cdn, deploy-staging, check-changes]
    if: |
      always() &&
      vars.VERCEL_DEPLOY_ENABLED == 'true' &&
      (
        (needs.deploy-staging.result == 'success' && github.event_name == 'push') ||
        (github.event.inputs.promote_to_production == 'true' &&
         needs.lint.result == 'success' &&
         needs.typecheck.result == 'success' &&
         needs.test-web.result == 'success' &&
         needs.test-mcp.result == 'success' &&
         (needs.build-wasm.result == 'success' || needs.build-wasm.result == 'skipped') &&
         (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') &&
         needs.security.result == 'success' &&
         (needs.upload-wasm-cdn.result == 'success' || needs.upload-wasm-cdn.result == 'skipped'))
      )
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Vercel CLI
        run: npm i -g vercel@50.34.3

      - name: Capture current production URL (last-known-good)
        id: prev-deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Retrieve the URL currently aliased to production for rollback purposes.
          # `vercel ls` lists deployments with a stable tabular format; the first
          # READY row is the currently live deployment. We take field 2 (the URL).
          prev_url=$(vercel ls --scope "$VERCEL_ORG_ID" --token="$VERCEL_TOKEN" \
            2>/dev/null \
            | grep -E 'READY' \
            | head -1 \
            | awk '{print $2}' \
            | sed 's|/*$||' || echo "")
          # Ensure the URL has an https:// prefix.
          if [ -n "$prev_url" ] && [ "${prev_url#https://}" = "$prev_url" ]; then
            prev_url="https://${prev_url}"
          fi
          echo "prev_url=${prev_url}" >> "$GITHUB_OUTPUT"
          echo "Last-known-good production URL: ${prev_url:-unknown}"

      # Pre-flight: assert the production domain is attached to THIS project in
      # THIS scope. Catches the failure mode in #8518 where the apex+www were
      # registered under a different team scope (orphan hobby account), so
      # `vercel deploy --prod` succeeded but the alias-on-deploy was a no-op
      # and the user-facing domain stayed pinned to a stale build for days.
      # We fail loud here instead of letting smoke tests catch it post-deploy.
      # Inputs are repo secrets and literal strings only — no user-controlled data.
      - name: Verify production domain attachment
        env:
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EXPECTED_DOMAINS: 'spawnforge.ai www.spawnforge.ai'
        run: |
          response=$(curl -sS -w '\n%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/domains?teamId=${VERCEL_TEAM_ID}&limit=100")
          http_status=$(printf '%s\n' "$response" | tail -1)
          body=$(printf '%s\n' "$response" | sed '$d')
          if [ "$http_status" != "200" ]; then
            echo "::error::Vercel API returned $http_status for project domains lookup"
            echo "$body" | head -20
            exit 1
          fi
          attached=$(printf '%s' "$body" | jq -r '.domains[].name' | sort -u)
          echo "Domains attached to project ${VERCEL_PROJECT_ID}:"
          printf '%s\n' "$attached" | sed 's/^/  /'
          missing=()
          for d in $EXPECTED_DOMAINS; do
            if ! printf '%s\n' "$attached" | grep -qx "$d"; then
              missing+=("$d")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Production domain(s) not attached to project: ${missing[*]}"
            echo "::error::Aborting deploy — alias-on-deploy would be a no-op and traffic would stay on a stale build."
            echo "::error::Fix: Vercel dashboard -> spawnforge project -> Settings -> Domains -> Add ${missing[*]}"
            echo "::error::See #8518 for the full incident write-up."
            exit 1
          fi

      # Run from repo root — Vercel rootDirectory=web handles the subdirectory.
      # Adding working-directory:web here causes web/web path doubling on remote builds.
      - name: Pull Vercel environment (production)
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Install dependencies for migrations
        run: npm ci

      # ---------------------------------------------------------------------
      # Production schema-migration safety (#9456)
      #
      # `drizzle-kit push` mutates the live database before the new code is
      # deployed, and drizzle-kit 0.31.10 exits 0 even when the apply throws
      # (see the header of scripts/db-migration-guard.sh for the three verified
      # hazards). Nothing below trusts drizzle-kit's exit code.
      #
      # Order is load-bearing:
      #   1. snapshot branch      -- a restore point, BEFORE anything mutates prod
      #   2. throwaway branch     -- a real copy of prod data to rehearse against
      #   3. dry run + classifier -- emits the diff and blocks destructive SQL
      #   4. prod pgvector + apply
      #   5. convergence check    -- proves the apply did not half-fail
      # ---------------------------------------------------------------------
      - name: Create pre-migration Neon snapshot branch
        # Named `db-snapshot` because the suite pins that this step precedes
        # every production-mutating step by line number.
        id: db-snapshot
        # Gated on the union of the two production-mutating steps below
        # (drizzle-kit push AND the hand-authored SQL migrations), so no code
        # path can reach the database without a restore point existing first.
        if: contains(needs.check-changes.outputs.web-changed-files, 'db/schema') || contains(needs.check-changes.outputs.web-changed-files, 'drizzle/')
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          # A Neon branch is a copy-on-write clone of the parent at the instant
          # it is created -- i.e. a point-in-time snapshot taken for free. No
          # compute endpoint is attached; it is storage only until someone needs
          # it. neon-branch.sh exits 2 when the credentials are absent, which
          # fails this step and therefore the deploy: a production schema change
          # without a restore point is not permitted.
          name="db-snapshot-${GITHUB_RUN_ID}-${GITHUB_SHA:0:8}"
          out="$(bash scripts/neon-branch.sh create "$name")"
          echo "$out"
          branch_id="$(printf '%s\n' "$out" | sed -n 's/^branch_id=//p')"
          if [ -z "$branch_id" ]; then
            echo "::error::No snapshot branch id was returned -- refusing to migrate production."
            exit 1
          fi
          echo "snapshot_branch_id=${branch_id}" >> "$GITHUB_OUTPUT"
          echo "snapshot_branch_name=${name}" >> "$GITHUB_OUTPUT"
          echo "::notice::Pre-migration snapshot branch ${branch_id} (${name})"
          {
            echo "### Pre-migration database snapshot"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Snapshot branch id | \`${branch_id}\` |"
            echo "| Snapshot branch name | \`${name}\` |"
            echo
            echo "Restore procedure: [docs/operations/deploy-migration-rollback.md](docs/operations/deploy-migration-rollback.md)"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create throwaway Neon branch for the migration dry run
        id: db-dryrun-branch
        if: contains(needs.check-changes.outputs.web-changed-files, 'db/schema')
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          # This branch DOES get a read_write compute, because we are about to
          # run the real migration against it. Its connection URI is written to
          # a 0600 file rather than stdout, then masked before anything else in
          # the job can echo it.
          name="db-dryrun-${GITHUB_RUN_ID}-${GITHUB_SHA:0:8}"
          uri_file="${RUNNER_TEMP}/dryrun-db-uri"
          out="$(bash scripts/neon-branch.sh create "$name" --endpoint --uri-out "$uri_file")"
          echo "$out"
          branch_id="$(printf '%s\n' "$out" | sed -n 's/^branch_id=//p')"
          if [ -z "$branch_id" ]; then
            echo "::error::No dry-run branch id was returned."
            exit 1
          fi
          echo "::add-mask::$(cat "$uri_file")"
          echo "branch_id=${branch_id}" >> "$GITHUB_OUTPUT"
          echo "uri_file=${uri_file}" >> "$GITHUB_OUTPUT"
          echo "Dry-run branch: ${branch_id} (${name})"

      - name: Dry-run the schema migration against the throwaway branch
        id: db-dryrun
        if: contains(needs.check-changes.outputs.web-changed-files, 'db/schema')
        env:
          URI_FILE: ${{ steps.db-dryrun-branch.outputs.uri_file }}
          # drizzle-kit force-enables colour when GITHUB_ACTIONS is set, which
          # wraps the markers the classifier matches in ANSI escapes. Turning
          # colour off here is the belt; the classifier also strips escapes.
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: |
          DATABASE_URL="$(cat "$URI_FILE")"
          export DATABASE_URL
          # pgvector first, for the same reason as on production: drizzle-kit
          # emits `vector(1536)` columns but never `CREATE EXTENSION`.
          ( cd web && node --input-type=module -e "
            import { neon } from '@neondatabase/serverless';
            const sql = neon(process.env.DATABASE_URL);
            await sql('CREATE EXTENSION IF NOT EXISTS vector');
            console.log('pgvector extension ensured on dry-run branch');
          " )
          # NO --force here. Without it drizzle-kit prints its own data-loss
          # classification, which is the strongest destructive signal we get.
          # Its exit code is meaningless, so ignore it and classify the text.
          ( cd web && npx drizzle-kit push --verbose ) > "${RUNNER_TEMP}/dryrun-push.log" 2>&1 || true
          echo "--- captured dry-run output ---"
          cat "${RUNNER_TEMP}/dryrun-push.log"

      - name: Gate the migration plan (destructive-diff detector)
        id: db-gate
        if: contains(needs.check-changes.outputs.web-changed-files, 'db/schema')
        env:
          # Two deliberate approval routes, both requiring a human act:
          #   * re-run the workflow with the allow_destructive_migration input
          #   * push a commit whose message contains [allow-destructive-migration]
          # The guard demands the exact string "true"; everything else blocks.
          ALLOW_DESTRUCTIVE_MIGRATION: ${{ github.event.inputs.allow_destructive_migration == 'true' || contains(github.event.head_commit.message, '[allow-destructive-migration]') }}
        run: |
          # tee writes the plan to the job summary as it goes, so the diff is
          # published even when the gate then fails the job. pipefail (on by
          # default in GitHub's bash) propagates the guard's exit code.
          bash scripts/db-migration-guard.sh plan "${RUNNER_TEMP}/dryrun-push.log" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Delete the throwaway dry-run branch
        # always(): the branch carries a live compute and a full copy of
        # production data. It must not survive a blocked or failed gate.
        if: ${{ always() && steps.db-dryrun-branch.outputs.branch_id != '' }}
        continue-on-error: true
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          DRYRUN_BRANCH_ID: ${{ steps.db-dryrun-branch.outputs.branch_id }}
        run: bash scripts/neon-branch.sh delete "$DRYRUN_BRANCH_ID"

      - name: Enable pgvector extension
        # MUST run BEFORE `drizzle-kit push`. drizzle-kit's schema-diff engine
        # emits `graph_nodes.embedding vector(1536)` + an HNSW index but does NOT
        # emit `CREATE EXTENSION` for the built-in `vector` type (see the comment
        # in drizzle/0010_graph_retrieval_nodes_edges.sql). On a production DB that
        # has never enabled pgvector, push would fail with `type "vector" does not
        # exist` before the "Apply custom SQL migrations" step below (which also
        # carries this statement) ever gets a chance to run — that step is ordered
        # AFTER push, so it cannot self-heal the failure. Enabling the extension in
        # its own step here guarantees the vector type exists first.
        # CREATE EXTENSION IF NOT EXISTS is idempotent and Neon-supported.
        # Gated identically to the push step: only needed when schema files change.
        if: contains(needs.check-changes.outputs.web-changed-files, 'db/schema')
        working-directory: web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node --input-type=module -e "
            import { neon } from '@neondatabase/serverless';
            const sql = neon(process.env.DATABASE_URL);
            await sql('CREATE EXTENSION IF NOT EXISTS vector');
            console.log('pgvector extension ensured');
          "

      - name: Apply schema migration to production
        # `push` (not `generate` + `migrate`) is a deliberate, documented choice:
        # docs/decisions/2026-08-29-drizzle-push-vs-migrate.md. The safety this
        # step used to lack now comes from the surrounding steps, not from the
        # command itself.
        #
        # --force is load-bearing, NOT a bypass. Without it a data-loss diff
        # reaches drizzle-kit's interactive prompt, hanji's render() rejects
        # because CI has no TTY, pgPush swallows the rejection in its catch
        # block, and the migration is SILENTLY SKIPPED while the deploy proceeds
        # against the old schema. The destructive gate above has already run and
        # has already blocked anything that was not explicitly approved, so by
        # the time we get here there is nothing left for a prompt to protect.
        #
        # DATABASE_URL is a repository secret pointing at the production DB.
        if: contains(needs.check-changes.outputs.web-changed-files, 'db/schema')
        working-directory: web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: |
          # `|| true`: drizzle-kit exits 0 on failure anyway, so its status
          # carries no information either way. The verify step below is what
          # actually decides whether this worked.
          npx drizzle-kit push --verbose --force > "${RUNNER_TEMP}/prod-push.log" 2>&1 || true
          cat "${RUNNER_TEMP}/prod-push.log"

      - name: Verify the production schema converged
        # Closes hazards 1 and 2 from scripts/db-migration-guard.sh: a push that
        # threw part-way through its untransacted apply loop still exits 0 and
        # still prints most of a success log. Re-running push is the only honest
        # test -- a converged schema has nothing left to do.
        if: contains(needs.check-changes.outputs.web-changed-files, 'db/schema')
        working-directory: web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NO_COLOR: '1'
          FORCE_COLOR: '0'
        run: |
          npx drizzle-kit push --verbose --force > "${RUNNER_TEMP}/verify-push.log" 2>&1 || true
          cat "${RUNNER_TEMP}/verify-push.log"
          bash "${GITHUB_WORKSPACE}"/scripts/db-migration-guard.sh verify "${RUNNER_TEMP}/verify-push.log" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Apply custom SQL migrations
        # Drizzle can't model partial unique indexes (WHERE predicates) or
        # CONCURRENTLY, so these SQL files are applied directly here. They are
        # idempotent (CREATE ... IF NOT EXISTS / CONCURRENTLY skips an existing
        # index), and any residual "already exists" is caught below.
        #
        # Neon's HTTP driver (`neon()`) sends each call as ONE query over the
        # extended (prepared-statement) protocol, which permits only a SINGLE
        # statement — passing a whole multi-statement file throws "cannot insert
        # multiple commands into a prepared statement". Drizzle SQL files ARE
        # multi-statement, delimited by the canonical `--> statement-breakpoint`
        # marker, so split on it and apply each statement on its own. INVARIANT:
        # every multi-statement migration file MUST delimit each statement with
        # `--> statement-breakpoint` (drizzle-kit emits this automatically; a
        # hand-authored migration must add it too). A file whose statements are
        # NOT so delimited yields a single multi-command segment that neon()
        # rejects with "cannot insert multiple commands into a prepared
        # statement", failing this step (0009 regressed exactly this way until a
        # marker was added between its two ALTER TABLEs). A single-statement file
        # legitimately splits to a one-element array. We deliberately do NOT
        # split on `;` instead — dollar-quoted bodies (e.g. 0006's `DO $$ ... $$;`
        # blocks) contain semicolons that are not statement terminators, so only
        # the `--> statement-breakpoint` marker is a safe boundary. We can't use
        # sql.transaction([...]) here because CREATE INDEX CONCURRENTLY may not
        # run inside a transaction, and we need per-statement idempotency.
        if: contains(needs.check-changes.outputs.web-changed-files, 'db/schema') || contains(needs.check-changes.outputs.web-changed-files, 'drizzle/')
        working-directory: web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node --input-type=module -e "
            import { neon } from '@neondatabase/serverless';
            import { readdirSync, readFileSync } from 'fs';
            const sql = neon(process.env.DATABASE_URL);
            const files = readdirSync('drizzle').filter(f => f.match(/^0\d+.*\.sql$/)).sort();
            for (const f of files) {
              console.log('Applying drizzle/' + f);
              const content = readFileSync('drizzle/' + f, 'utf8');
              const statements = content.split('--> statement-breakpoint').map(s => s.trim()).filter(Boolean);
              let failed = 0;
              for (const stmt of statements) {
                try { await sql(stmt); }
                catch(e) {
                  const msg = e.message || '';
                  const isIdempotent = msg.includes('already exists') || msg.includes('duplicate key') || msg.includes('relation') && msg.includes('already');
                  if (isIdempotent) { console.log('  Skipped (idempotent):', msg); }
                  else { console.error('  FAILED:', msg); failed++; process.exitCode = 1; }
                }
              }
              if (failed) { console.error('  FAILED (' + failed + ' of ' + statements.length + ' statement(s) failed)'); }
              else { console.log('  OK (' + statements.length + ' statement(s))'); }
            }
          "

      - name: Download WASM artifacts for same-origin fallback
        id: download-wasm-production
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wasm-binaries
          path: engine/
        continue-on-error: true

      - name: Populate same-origin WASM fallback
        if: steps.download-wasm-production.outcome == 'success'
        run: |
          for variant in webgl2 webgpu webgl2-runtime webgpu-runtime; do
            src="engine/pkg-${variant}"
            dest="web/public/engine-pkg-${variant}"
            if [ -d "$src" ]; then
              mkdir -p "$dest"
              cp "$src"/* "$dest"/
            fi
          done
          bash scripts/generate-wasm-manifests.sh web/public

      - name: Deploy to production (remote build)
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ENGINE_VERSION: ${{ github.sha }}
        run: |
          url=$(vercel deploy --prod --token="$VERCEL_TOKEN" \
            --build-env NEXT_PUBLIC_ENGINE_VERSION="$ENGINE_VERSION")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to production: $url"

      - name: Post-deploy health check (production)
        id: health-check-production
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          HEALTH_CHECK_STABILIZE_S: '10'
          HEALTH_CHECK_RETRIES: '3'
          HEALTH_CHECK_INTERVAL_S: '10'
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bash scripts/post-deploy-health-check.sh "$DEPLOY_URL"

      - name: Install Playwright for smoke tests
        if: ${{ success() }}
        run: |
          npm ci
          cd web && npx playwright install --with-deps chromium

      - name: Run production smoke tests
        if: ${{ success() }}
        id: smoke-tests
        working-directory: web
        env:
          PRODUCTION_URL: https://www.spawnforge.ai
        # Use dedicated smoke config — no local webServer, hits live URL directly
        run: npx playwright test --config playwright.smoke.config.ts --project=chromium

      - name: Rollback production on health check or smoke test failure
        if: ${{ failure() && (steps.health-check-production.outcome == 'failure' || steps.smoke-tests.outcome == 'failure') && steps.prev-deploy.outputs.prev_url != '' }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREV_URL: ${{ steps.prev-deploy.outputs.prev_url }}
          NEW_URL: ${{ steps.deploy.outputs.url }}
          SNAPSHOT_BRANCH_ID: ${{ steps.db-snapshot.outputs.snapshot_branch_id }}
          SNAPSHOT_BRANCH_NAME: ${{ steps.db-snapshot.outputs.snapshot_branch_name }}
        run: |
          echo "::error::Health check failed -- rolling back production to $PREV_URL"
          vercel promote "$PREV_URL" --scope "$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
          echo "Code rollback complete. Production code restored to: $PREV_URL"

          # Be explicit about the half of the deploy this does NOT undo. A
          # green "Rollback complete" next to a migrated database is how an
          # operator ends up debugging old code against a new schema.
          if [ -n "$SNAPSHOT_BRANCH_ID" ]; then
            echo "::error::vercel promote reverted the CODE ONLY. It does NOT revert the database schema."
            echo "::error::A schema migration ran earlier in this job and is STILL APPLIED to production."
            echo "::error::The restored code is now running against the NEW schema. If they are incompatible, production is still broken."
            echo "::error::Pre-migration snapshot branch: ${SNAPSHOT_BRANCH_ID} (${SNAPSHOT_BRANCH_NAME})"
            echo "::error::Restoring the schema is a deliberate human decision and is NOT automated -- it discards every write made since the snapshot."
            echo "::error::Exact restore command: docs/operations/deploy-migration-rollback.md"
            {
              echo "### Rollback: code reverted, schema NOT reverted"
              echo
              echo "\`vercel promote\` restored the previous deployment, but it does NOT revert the database schema."
              echo "The migration applied in this run is still live."
              echo
              echo "| | |"
              echo "|---|---|"
              echo "| Restored code | ${PREV_URL} |"
              echo "| Pre-migration snapshot branch | \`${SNAPSHOT_BRANCH_ID}\` (\`${SNAPSHOT_BRANCH_NAME}\`) |"
              echo
              echo "Restoring the schema discards every write since the snapshot, so it is a human decision."
              echo "The exact command is in [docs/operations/deploy-migration-rollback.md](docs/operations/deploy-migration-rollback.md)."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No schema migration ran in this deploy -- the code rollback is complete on its own."
          fi

      - name: Notify Slack of automatic rollback
        if: ${{ failure() && (steps.health-check-production.outcome == 'failure' || steps.smoke-tests.outcome == 'failure') && steps.prev-deploy.outputs.prev_url != '' && vars.SLACK_WEBHOOK_INCIDENTS != '' }}
        env:
          SLACK_WEBHOOK: ${{ vars.SLACK_WEBHOOK_INCIDENTS }}
          PREV_URL: ${{ steps.prev-deploy.outputs.prev_url }}
          NEW_URL: ${{ steps.deploy.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.sha }}
          SNAPSHOT_BRANCH_ID: ${{ steps.db-snapshot.outputs.snapshot_branch_id }}
        run: |
          short_sha="${COMMIT_SHA:0:8}"
          # The incident channel gets the same caveat the job log gets: the
          # rollback is code-only whenever a migration ran.
          if [ -n "$SNAPSHOT_BRANCH_ID" ]; then
            schema_line=":warning: A schema migration ran in this deploy. The rollback reverted CODE ONLY -- the schema is still applied. Pre-migration snapshot branch: \`${SNAPSHOT_BRANCH_ID}\`. Restore steps: docs/operations/deploy-migration-rollback.md"
          else
            schema_line="No schema migration ran in this deploy."
          fi
          payload=$(printf '{"text":"*SpawnForge Production Auto-Rollback*\n:rotating_light: Health check failed for commit `%s`.\n*Failed deployment:* <%s|%s>\n*Rolled back to:* <%s|%s>\n*Workflow run:* <%s|View run>\n%s"}' \
            "$short_sha" "$NEW_URL" "$NEW_URL" "$PREV_URL" "$PREV_URL" "$RUN_URL" "$schema_line")
          curl --silent --fail -X POST "$SLACK_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$payload" || echo "Slack notification failed (non-fatal)"

      - name: Prune expired pre-migration snapshot branches
        # Snapshots are retained for 14 days -- long enough to be useful for a
        # post-incident restore, short enough that they do not accumulate
        # storage forever. Housekeeping must never fail a deploy that worked,
        # hence always() + continue-on-error.
        if: ${{ always() && steps.db-snapshot.outputs.snapshot_branch_id != '' }}
        continue-on-error: true
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: bash scripts/neon-branch.sh prune 'db-snapshot-' 14


  # ---- Docs Site Deploy ----
  # Deploys apps/docs to the Vercel docs project when docs or MCP manifest changed.
  # Independent of the main web deploy — docs can ship without a full Vercel web build.
  deploy-docs:
    name: Deploy Docs
    needs: [check-deployment-drift, lint, typecheck, security]
    if: (needs.check-deployment-drift.outputs.docs-changed == 'true' || github.event_name == 'workflow_dispatch') && needs.lint.result != 'failure' && needs.typecheck.result != 'failure' && needs.security.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Build @spawnforge/ui
        run: cd packages/ui && npm run build

      - name: Install Vercel CLI
        run: npm i -g vercel@50.34.3

      # Run from repo root — Vercel rootDirectory=apps/docs handles the subdirectory.
      # Same pattern as the main web deploy. Do NOT cd into apps/docs — that causes
      # the remote build to only receive the subdirectory, breaking install commands
      # that reference the monorepo root (packages/ui build).
      - name: Pull Vercel environment (docs)
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy docs to production
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --archive=tgz --token="$VERCEL_TOKEN"

  # ---- Design Workbench Deploy ----
  # Deploys apps/design (Storybook) to the Vercel design project when UI or design files changed.
  deploy-design:
    name: Deploy Design Workbench
    needs: [check-deployment-drift, lint, typecheck, security]
    if: (needs.check-deployment-drift.outputs.design-changed == 'true' || github.event_name == 'workflow_dispatch') && needs.lint.result != 'failure' && needs.typecheck.result != 'failure' && needs.security.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      - name: Build @spawnforge/ui
        run: cd packages/ui && npm run build

      - name: Install Vercel CLI
        run: npm i -g vercel@50.34.3

      # Run from repo root — Vercel rootDirectory=apps/design handles the subdirectory.
      # Same pattern as the main web deploy. Do NOT cd into apps/design — that causes
      # the remote build to only receive the subdirectory, breaking install commands
      # that reference the monorepo root (packages/ui build).
      - name: Pull Vercel environment (design)
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DESIGN_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy design workbench to production
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DESIGN_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --archive=tgz --token="$VERCEL_TOKEN"
