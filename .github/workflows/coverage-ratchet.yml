name: Coverage Ratchet

# Standalone workflow that ratchets coverage thresholds upward when actual
# coverage on main exceeds them. It runs standalone because quality-gates.yml
# is a reusable workflow and inherits the caller's permissions (ci.yml →
# contents: read).
#
# The bump ships as a PULL REQUEST, never a direct push: the repo ruleset
# forbids pushes to main (GH013 — "Changes must be made through a pull
# request" + the required "CI Success" check, which only reports on
# pull_request events). The previous direct-push design failed on every main
# push and the ratchet silently never ratcheted (PF-947 / #8920). The job
# force-pushes a fixed auto/coverage-ratchet branch and opens a PR if one
# isn't already open, so successive runs update the same PR instead of
# stacking new ones.

on:
  push:
    branches: [main]
    paths:
      - 'web/src/**'
      - 'web/vitest.config.ts'
      - 'web/vitest.config.node.ts'
      - 'web/vitest.config.jsdom.ts'
      - 'web/package.json'

# Least privilege: labeling a PR rides the issues REST endpoint, but GitHub's
# permission engine accepts pull-requests: write when the target is a PR
# (actions/labeler precedent) — so issues: write is deliberately NOT granted.
# If labeling ever fails, gh pr create errors and the job goes red (loud, not
# silent).
permissions:
  contents: write       # push the auto/coverage-ratchet branch
  pull-requests: write  # create/update/label the ratchet PR

concurrency:
  # Stable group key — serializes ratchet runs on main to prevent push conflicts
  group: coverage-ratchet-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ratchet:
    name: Ratchet Coverage Thresholds
    # Skip ratchet commits from github-actions[bot] to prevent retrigger loops
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        working-directory: web
        id: vitest
        # timeout 600: vitest+coverage can hang in CI (jsdom open handles,
        # vitest#3077) — fail fast at 10 min instead of burning the 20-min job
        # timeout. Exit 124 surfaces through the warning step below.
        run: |
          timeout 600 npx vitest run --coverage --coverage.reporter=json-summary --pool=threads
        continue-on-error: true

      - name: Check vitest exit
        if: steps.vitest.outcome == 'failure'
        run: echo "::warning::vitest exited non-zero — coverage may be incomplete"

      - name: Run ratchet script
        run: bash .claude/skills/testing/scripts/ratchet-coverage.sh web/coverage

      # Keep the agentic-sync source of truth in lockstep: canonical.json feeds
      # the coverage-threshold figures shown in AGENTS.md / .cursorrules /
      # copilot-instructions, and the agentic-sync CI gate only diffs targets
      # against canonical.json — so a ratchet that bumps vitest.config.ts alone
      # leaves stale numbers advertised as authoritative (found by review on
      # #8942). Threshold keys are extracted from the thresholds block only.
      - name: Sync onboarding coverage facts
        run: |
          if git diff --quiet web/vitest.config.ts; then
            echo "No threshold changes — nothing to sync."
            exit 0
          fi
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const cfg = readFileSync("web/vitest.config.ts", "utf8");
            const block = cfg.match(/thresholds:\s*\{[^}]*\}/);
            if (!block) throw new Error("thresholds block not found in web/vitest.config.ts");
            const grab = (key) => {
              const m = block[0].match(new RegExp(key + ":\\s*(\\d+)"));
              if (!m) throw new Error("threshold key missing: " + key);
              return Number(m[1]);
            };
            const path = "tools/agentic-sync/canonical.json";
            const canonical = JSON.parse(readFileSync(path, "utf8"));
            canonical.facts.coverageThresholds = {
              statements: grab("statements"),
              branches: grab("branches"),
              functions: grab("functions"),
              lines: grab("lines"),
            };
            writeFileSync(path, JSON.stringify(canonical, null, 2) + "\n");
          '
          node tools/agentic-sync/sync.mjs --write

      # Ship the bump as a PR. Notes on the moving parts:
      #   - The commit message must NOT contain [skip ci] — the ratchet PR needs
      #     a pull_request CI run or the required "CI Success" check never
      #     reports and the PR is unmergeable.
      #   - PF-947 in the PR body satisfies the Require Linked Work Item gate
      #     (pr-workitem-check.yml regex-matches PF-[0-9]+ in title/body/branch
      #     — no ticket-existence lookup — so it keeps passing after #8920
      #     closes). Deliberately NOT a
      #     "Closes #" reference — this PR recurs and must not re-close the
      #     ticket that tracks the mechanism.
      #   - The "skip changeset" label satisfies the Require Changeset gate
      #     (a threshold bump is CI-config-only, nothing user-facing).
      #   - Bot-created PRs DO get pull_request runs in this repo: GitHub
      #     attributes them to the human triggering_actor of the parent push
      #     (verified on the changesets Version Packages PR), so the
      #     GITHUB_TOKEN no-retrigger rule does not strand this PR.
      - name: Open or update ratchet PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet web/vitest.config.ts; then
            echo "No threshold changes — thresholds already match measured coverage."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="auto/coverage-ratchet"
          git checkout -B "$BRANCH"
          git add web/vitest.config.ts tools/agentic-sync/canonical.json \
            AGENTS.md .github/copilot-instructions.md .codex/AGENTS.md .cursorrules
          git commit -m "chore: ratchet coverage thresholds (PF-947)"
          git push --force origin "$BRANCH"
          OPEN_PR="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[].number')"
          if [ -n "$OPEN_PR" ]; then
            echo "Ratchet PR #${OPEN_PR} already open — branch force-push updated it."
            exit 0
          fi
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: ratchet coverage thresholds" \
            --label "skip changeset" \
            --body "$(printf '## Summary\n- Automated coverage-threshold ratchet (PF-947): measured coverage on main now exceeds the recorded thresholds in web/vitest.config.ts, so this bumps them to match and locks in the gain.\n\nGenerated by the Coverage Ratchet workflow. This branch is force-pushed on every ratchet run — do not push manual commits to it.\n\n## Test plan\n- [ ] CI Success green (config-only change; the bumped thresholds apply to every future --coverage run)\n')"
