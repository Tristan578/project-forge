name: engine-cdn Worker Test

on:
  pull_request:
    paths:
      - 'infra/engine-cdn/**'
      - '.github/workflows/engine-cdn-test.yml'
      - '.node-version'

concurrency:
  group: engine-cdn-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test engine-cdn Worker
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install pinned local Workers runtime
        run: npm ci --prefix infra/engine-cdn --workspaces=false --ignore-scripts

      - name: Audit all standalone Workers dependencies
        run: npm audit --prefix infra/engine-cdn --workspaces=false --include=dev --audit-level=moderate

      - name: Run configured worker and binding regressions
        working-directory: infra/engine-cdn
        run: npm test
