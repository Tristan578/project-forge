name: Lockfile Sync

# Fails a PR when a package.json change is not accompanied by a regenerated root
# package-lock.json. This is a single-root-lockfile monorepo: ONE root lockfile
# governs web/, mcp-server/ and the root workspace, so a Dependabot npm PR
# scoped to `directory: /web` (or a hand-edit) can bump a manifest without
# updating the lockfile — then every `npm ci` (all of CI + the Quality Gates
# jobs) breaks on main with EUSAGE. That shipped twice (#8655, #8658 → #8683)
# because npm ci only trips AFTER the bad state lands. This gate trips BEFORE
# merge by regenerating the lockfile from the manifests and diffing.
#
# Path-gated so it only runs when a manifest or the lockfile changes. The
# decision logic lives in scripts/check-lockfile-sync.sh (unit-tested by
# lockfile-sync-tests.yml). To make this blocking, add the "Lockfile Sync"
# check to the main branch ruleset's required checks.
on:
  pull_request:
    branches: [main]
    paths:
      - '**/package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  drift-gate:
    name: Lockfile Sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Check root lockfile is in sync with the manifests
        run: bash scripts/check-lockfile-sync.sh
