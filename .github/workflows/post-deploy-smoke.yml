name: Post-Deploy Smoke Tests

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Base URL to smoke-test (no trailing slash)'
        required: false
        default: 'https://spawnforge.ai'
        type: string

  workflow_call:
    inputs:
      target_url:
        description: 'Base URL to smoke-test (no trailing slash)'
        required: false
        default: 'https://spawnforge.ai'
        type: string

  workflow_run:
    workflows: [CD]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Run for: workflow_dispatch (manual), workflow_call (from CD), or workflow_run (when CD succeeded).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' ||
      github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      # Used by the notify step at the end of this job only. Declared at JOB
      # level, not workflow level, so the workflow-level block stays read-only.
      issues: write

    env:
      # Prefer explicit input (workflow_dispatch / workflow_call); then DEPLOY_URL var; then production.
      # NOTE: the apex (https://spawnforge.ai) 307-redirects to the canonical host
      # (https://www.spawnforge.ai). Every curl below MUST pass --location so it
      # follows that hop to the final 200 — otherwise the smoke test sees the 307
      # and fails on a healthy deploy, masking real outages. --location is a no-op
      # for targets that don't redirect (www, Vercel preview URLs, DEPLOY_URL).
      TARGET_URL: ${{ inputs.target_url || vars.DEPLOY_URL || 'https://spawnforge.ai' }}

    steps:
      - name: Resolve target URL
        run: echo "Smoke-testing $TARGET_URL"

      # -- Check 1: Health endpoint ----------------------------------------------
      - name: Health check (/api/health)
        id: health
        run: |
          HTTP_CODE=$(curl --silent --location --output /tmp/health_body.json \
            --write-out "%{http_code}" \
            --max-time 10 \
            "$TARGET_URL/api/health")
          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          echo "HTTP $HTTP_CODE"
          cat /tmp/health_body.json || true

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::/api/health returned HTTP $HTTP_CODE (expected 200)"
            exit 1
          fi

          # Must be a JSON body (Content-Type check not reliable through curl output,
          # so verify we can parse the body as JSON).
          if ! python3 -c "import sys, json; json.load(open('/tmp/health_body.json'))" 2>/dev/null; then
            echo "::error::/api/health response is not valid JSON"
            exit 1
          fi
          echo "/api/health OK"

      # -- Check 2: Homepage HTML ------------------------------------------------
      - name: Homepage loads (/)
        id: homepage
        run: |
          HTTP_CODE=$(curl --silent --location --output /tmp/homepage_body.html \
            --write-out "%{http_code}" \
            --max-time 10 \
            "$TARGET_URL/")
          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          echo "HTTP $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::Homepage returned HTTP $HTTP_CODE (expected 200)"
            exit 1
          fi

          if ! grep -qi "SpawnForge" /tmp/homepage_body.html; then
            echo "::error::Homepage HTML does not contain 'SpawnForge'"
            exit 1
          fi
          echo "Homepage OK"

      # -- Check 3: Static asset ------------------------------------------------
      - name: Static asset (/manifest.json)
        id: manifest
        run: |
          HTTP_CODE=$(curl --silent --location --output /tmp/manifest_body.json \
            --write-out "%{http_code}" \
            --max-time 10 \
            "$TARGET_URL/manifest.json")
          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          echo "HTTP $HTTP_CODE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::/manifest.json returned HTTP $HTTP_CODE (expected 200)"
            exit 1
          fi
          echo "/manifest.json OK"

      # -- Check 4: WASM binary -------------------------------------------------
      # When R2 CDN is enabled, WASM lives at engine.spawnforge.ai, not in Vercel.
      - name: WASM available
        id: wasm
        env:
          R2_CDN_ENABLED: ${{ vars.R2_CDN_ENABLED }}
        run: |
          if [ "${R2_CDN_ENABLED:-false}" = "true" ]; then
            WASM_URL="https://engine.spawnforge.ai/latest/engine-pkg-webgl2/forge_engine_bg.wasm"
          else
            WASM_URL="${TARGET_URL}/engine-pkg-webgl2/forge_engine_bg.wasm"
          fi
          WASM_PATH="$WASM_URL"
          echo "Checking WASM at: $WASM_URL"
          RESPONSE=$(curl --silent --location --head --output /dev/null \
            --write-out "%{http_code}|%{content_type}" \
            --max-time 10 \
            "$WASM_URL")
          HTTP_CODE=$(echo "$RESPONSE" | cut -d'|' -f1)
          CONTENT_TYPE=$(echo "$RESPONSE" | cut -d'|' -f2)
          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          echo "content_type=$CONTENT_TYPE" >> "$GITHUB_OUTPUT"
          echo "HTTP $HTTP_CODE  Content-Type: $CONTENT_TYPE"

          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "::error::$WASM_PATH returned HTTP $HTTP_CODE (expected 200)"
            exit 1
          fi

          # Accept application/wasm or application/octet-stream (CDN may differ).
          if echo "$CONTENT_TYPE" | grep -qvE "application/(wasm|octet-stream)"; then
            echo "::warning::$WASM_PATH content-type is '$CONTENT_TYPE' -- expected application/wasm or application/octet-stream"
          fi
          echo "WASM OK"

      # -- Summary --------------------------------------------------------------
      - name: Write job summary
        if: always()
        env:
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          HOMEPAGE_OUTCOME: ${{ steps.homepage.outcome }}
          MANIFEST_OUTCOME: ${{ steps.manifest.outcome }}
          WASM_OUTCOME: ${{ steps.wasm.outcome }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          health_result() { [ "$HEALTH_OUTCOME" = "success" ] && echo "PASS" || echo "FAIL"; }
          homepage_result() { [ "$HOMEPAGE_OUTCOME" = "success" ] && echo "PASS" || echo "FAIL"; }
          manifest_result() { [ "$MANIFEST_OUTCOME" = "success" ] && echo "PASS" || echo "FAIL"; }
          wasm_result() { [ "$WASM_OUTCOME" = "success" ] && echo "PASS" || echo "FAIL"; }

          {
            echo "## Post-Deploy Smoke Results"
            echo ""
            echo "| Check | Result |"
            echo "|-------|--------|"
            echo "| /api/health | $(health_result) |"
            echo "| / (homepage) | $(homepage_result) |"
            echo "| /manifest.json | $(manifest_result) |"
            echo "| WASM binary | $(wasm_result) |"
            echo ""
            echo "**Target:** \`$TARGET_URL\`"
            echo "**Triggered by:** \`$EVENT_NAME\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # The workflow_run path fires only after CD SUCCEEDED, so a failure here
      # means production is broken behind a green deploy — and workflow_run
      # conclusions are invisible from the CD run's own status. The job summary
      # above is written into a run nobody is watching, so surface the failure
      # as an issue instead (PF-1216 / #9438).
      #
      # Scoped to workflow_run: workflow_dispatch and workflow_call are the
      # debugging paths (a deliberately-broken target_url is a normal way to
      # exercise this file) and must never file issues. The checkout is
      # conditional for the same reason the happy path has none — this job is
      # otherwise pure curl.
      - name: Check out the notifier
        if: failure() && github.event_name == 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Open or update the production-smoke issue
        if: failure() && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY_KEY: post-deploy-smoke
          NOTIFY_TITLE: 'Production smoke tests are failing after a green deploy'
          NOTIFY_LABELS: priority-p0,area-infra
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          HOMEPAGE_OUTCOME: ${{ steps.homepage.outcome }}
          MANIFEST_OUTCOME: ${{ steps.manifest.outcome }}
          WASM_OUTCOME: ${{ steps.wasm.outcome }}
        run: |
          NOTIFY_BODY="Post-deploy smoke tests failed against \`${TARGET_URL}\` after CD reported success.
          Production is likely broken behind a green deploy.

          | Check | Result |
          |-------|--------|
          | /api/health | ${HEALTH_OUTCOME} |
          | / (homepage) | ${HOMEPAGE_OUTCOME} |
          | /manifest.json | ${MANIFEST_OUTCOME} |
          | WASM binary | ${WASM_OUTCOME} |

          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **CD run:** ${{ github.event.workflow_run.html_url }}

          See \`docs/production-support.md\` for the rollback procedure. This issue
          is reused for every subsequent failure — close it once smoke is green."
          export NOTIFY_BODY
          bash scripts/notify-workflow-failure.sh
