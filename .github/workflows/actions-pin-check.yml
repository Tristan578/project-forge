name: Actions Pin Check

# Fails a PR that introduces a mutable-tag action pin in any hand-written
# workflow (audit finding F35, #8627). The generated *.lock.yml files are
# excluded by the guard and covered separately by the gh-aw Lock Sync gate.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/check-actions-pinned.sh'

permissions:
  contents: read

jobs:
  pin-check:
    name: Verify actions are SHA-pinned
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check workflow action pins
        run: bash scripts/check-actions-pinned.sh
