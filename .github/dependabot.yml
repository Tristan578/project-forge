version: 2

updates:
  # npm dependencies — this is an npm workspaces monorepo with a SINGLE root
  # package-lock.json (web/ and mcp-server/ have no lockfiles of their own).
  # Dependabot must target the directory containing the lockfile (root) so it
  # resolves and relocks the real workspace tree; watching /web or /mcp-server
  # would edit manifests it cannot relock, producing root-lockfile EUSAGE drift
  # that breaks `npm ci` on main (the #8655 / #8658 incidents). See #8626.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # eslint 10 is un-mergeable until the plugin ecosystem catches up.
      # eslint-plugin-react 7.37.5 (latest, 2025-04, peer eslint ^3..^9.7) still
      # calls the removed context.getFilename() and crashes every rule under
      # ESLint 10 — reproduced on #8914's Lint job (TypeError at
      # eslint-plugin-react/lib/util/version.js:31). eslint-config-next 16.2.10
      # hard-depends on eslint-plugin-react ^7.37.0, so no config change on our
      # side avoids it; eslint-plugin-jsx-a11y 6.10.2 and eslint-plugin-import
      # 2.32.0 (both latest) also cap peers at eslint ^9. 9.x patch/minor
      # updates still flow (9.39.4 is npm's `maintenance` dist-tag). Remove
      # when jsx-eslint/eslint-plugin-react#3977 ships an eslint-10 release AND
      # eslint-config-next adopts it (vercel/next.js#89764). Tracking: #8917
      # (PF-945).
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # Rust/Cargo dependencies (engine)
  - package-ecosystem: cargo
    directory: /engine
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - rust
    ignore:
      # A Bevy release (0.18 → 0.19 was #8887) must land as ONE coordinated
      # migration across bevy + every bevy_* ecosystem crate + the local
      # transform-gizmo fork. A piecemeal per-crate bump (bevy_math 0.19.0 alone
      # while the workspace pinned bevy 0.18.1) leaves BOTH versions in
      # engine/Cargo.lock → type mismatches at the fork/engine boundary →
      # Quality Gates / WASM Build red — shipped live as #8897/#8898/#8899.
      #
      # #8887 landed 0.19, so this rule no longer blocks the 0.19 line: patch
      # updates (0.19.1 → 0.19.2) and ecosystem minors built on bevy 0.19 (e.g.
      # bevy_rapier 0.35 → 0.36, which still requires bevy ^0.19) flow again.
      # It is NARROWED to the next Bevy line rather than removed, because
      # removing it would reopen exactly the piecemeal failure above the day
      # bevy_* 0.20.0 ships. Residual gap: an ecosystem crate whose NEXT minor
      # moves to bevy 0.20 while keeping a < 0.20 version number (rapier,
      # panorbit) is not caught by a version range — close such a PR and fold
      # it into the coordinated 0.20 migration.
      - dependency-name: "bevy*"
        versions: [">= 0.20"]
      # egui-family crates (egui/emath/epaint/ecolor) are pinned as a matched
      # set by the local transform-gizmo fork (.transform-gizmo-fork/Cargo.toml,
      # reached via engine's path dependency — Dependabot edits it when relocking
      # /engine). A piecemeal bump (emath 0.35 alone in #8908; ecolor in #8869)
      # leaves two versions in engine/Cargo.lock → E0308 `expected epaint::Pos2,
      # found emath::Pos2` at the fork boundary → WASM Build red. Like bevy*,
      # they are 0.x crates, so 0.34 → 0.35 is `semver-minor`; patch updates
      # still flow. The set moves together when the fork moves. The Bevy 0.19
      # migration (#8887) did NOT move it: only the fork's core crate
      # (transform-gizmo) uses emath/epaint/ecolor, and it has no bevy
      # dependency, so the 0.34 set stayed. Tracking: #8911 (PF-944).
      - dependency-name: "egui*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "emath"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "epaint"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "ecolor"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    # The generated gh-aw `*.lock.yml` files are NOT hand-authored — `gh aw
    # compile` regenerates them and injects EVERY action ref (incl.
    # `actions/checkout`) from the compiler's own bundled pin registry, not from
    # Dependabot. So a Dependabot bump of a `uses:` inside a lock can never
    # survive the `gh-aw Lock Sync` gate (recompile re-emits the compiler's pin →
    # perpetual drift). It churned live on #8872 (checkout v6→v7) and #8880.
    # Exclude the generated locks from scanning entirely; hand-authored workflows
    # (ci.yml, cd.yml, quality-gates.yml) are still scanned and DO get bumped.
    # `exclude-paths` globs are relative to `directory` (root); GA 2025-08-26.
    exclude-paths:
      - ".github/workflows/*.lock.yml"
    ignore:
      # gh-aw-actions are managed by `gh aw compile` (version-locked to the gh-aw
      # compiler) — Dependabot must never bump them. Both the bare repo ref AND any
      # sub-action paths are ignored: the `/**` glob alone does NOT match the bare
      # `github/gh-aw-actions` name, which is what let #8717 and #8738 slip through
      # and fail the `gh-aw Lock Sync` gate by design.
      - dependency-name: "github/gh-aw-actions"
      - dependency-name: "github/gh-aw-actions/**"
