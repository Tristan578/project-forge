version: 2

updates:
  # npm dependencies (web)
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # npm dependencies (mcp-server)
  - package-ecosystem: npm
    directory: /mcp-server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies

  # Rust/Cargo dependencies (engine)
  - package-ecosystem: cargo
    directory: /engine
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - rust

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    ignore:
      # gh-aw-actions are managed by `gh aw compile` (version-locked to the gh-aw
      # compiler) — Dependabot must never bump them. Both the bare repo ref AND any
      # sub-action paths are ignored: the `/**` glob alone does NOT match the bare
      # `github/gh-aw-actions` name, which is what let #8717 and #8738 slip through
      # and fail the `gh-aw Lock Sync` gate by design.
      - dependency-name: "github/gh-aw-actions"
      - dependency-name: "github/gh-aw-actions/**"
