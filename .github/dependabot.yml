version: 2

updates:
  # npm dependencies — this is an npm workspaces monorepo with a SINGLE root
  # package-lock.json (web/ and mcp-server/ have no lockfiles of their own).
  # Dependabot must target the directory containing the lockfile (root) so it
  # resolves and relocks the real workspace tree; watching /web or /mcp-server
  # would edit manifests it cannot relock, producing root-lockfile EUSAGE drift
  # that breaks `npm ci` on main (the #8655 / #8658 incidents). See #8626.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Rust/Cargo dependencies (engine)
  - package-ecosystem: cargo
    directory: /engine
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - rust

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    ignore:
      # gh-aw-actions are managed by `gh aw compile` (version-locked to the gh-aw
      # compiler) — Dependabot must never bump them. Both the bare repo ref AND any
      # sub-action paths are ignored: the `/**` glob alone does NOT match the bare
      # `github/gh-aw-actions` name, which is what let #8717 and #8738 slip through
      # and fail the `gh-aw Lock Sync` gate by design.
      - dependency-name: "github/gh-aw-actions"
      - dependency-name: "github/gh-aw-actions/**"
