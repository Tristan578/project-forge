version: 2

updates:
  # npm dependencies (web)
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # portless >=0.13.1 requires Node >=24; this repo targets Node 20
      # (.nvmrc, engines ">=20 <25", all CI node-version: 20). Allow 0.13.0
      # (engines ">=20") but block the Node-24-only line until we adopt Node 24.
      - dependency-name: "portless"
        versions: [">=0.13.1"]

  # npm dependencies (mcp-server)
  - package-ecosystem: npm
    directory: /mcp-server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies

  # Rust/Cargo dependencies (engine)
  - package-ecosystem: cargo
    directory: /engine
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - rust

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
